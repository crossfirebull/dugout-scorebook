<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Dugout Scorebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scorebook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: scoreboard band across the top; below it the live situation + input pad on the left, the scorebook grid on the right (stacked on phones). */
:root {
  --paper: #f4f7f9;
  --surface: #ffffff;
  --ink: #14212c;
  --muted: #586a7a;
  --rule: #c7d5e1;
  --rule-soft: #e2eaf1;
  --board: #123b2a;
  --board-ink: #eef4ec;
  --board-dim: #8fb3a0;
  --lamp: #ffc93c;
  --stitch: #c8102e;
  --stitch-soft: #fbe6e9;
  --safe: #17784a;
  --safe-soft: #e1f3e9;
  --ink-blue: #1d4f9a;
  --infield: #e9d3b4;
  --grass: #cfe5d2;
  --shadow: 0 1px 2px rgba(20, 33, 44, .08), 0 4px 14px rgba(20, 33, 44, .06);
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1418; --surface: #161f26; --ink: #e5ecf1; --muted: #93a5b4;
    --rule: #2b3b48; --rule-soft: #1e2a33; --board: #0a2519; --board-ink: #eef4ec; --board-dim: #6f957f;
    --lamp: #ffd25c; --stitch: #ff5d70; --stitch-soft: #3a1a20; --safe: #4cc38a; --safe-soft: #12301f;
    --ink-blue: #7fb0ff; --infield: #5a4632; --grass: #1d3a27; --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1418; --surface: #161f26; --ink: #e5ecf1; --muted: #93a5b4;
  --rule: #2b3b48; --rule-soft: #1e2a33; --board: #0a2519; --board-ink: #eef4ec; --board-dim: #6f957f;
  --lamp: #ffd25c; --stitch: #ff5d70; --stitch-soft: #3a1a20; --safe: #4cc38a; --safe-soft: #12301f;
  --ink-blue: #7fb0ff; --infield: #5a4632; --grass: #1d3a27; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--ink-blue); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.chip { font-family: var(--f-label); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--rule-soft); color: var(--muted); }
.chip.live { background: var(--stitch); color: #fff; }
.topbar .spacer { flex: 1; }
.tbtn { min-height: 40px; padding: 0 12px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:disabled { opacity: .4; cursor: default; }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Scoreboard */
.board { background: var(--board); color: var(--board-ink); border-radius: 10px; padding: 6px 10px 8px; overflow: hidden; }
.board table { border-collapse: collapse; width: 100%; table-layout: fixed; font-variant-numeric: tabular-nums; }
.board th { font-family: var(--f-label); font-weight: 600; font-size: 11px; letter-spacing: .08em; color: var(--board-dim); text-transform: uppercase; padding: 2px 2px 3px; text-align: center; }
.board th.team { width: 32%; }
@media (min-width: 700px) { .board th.team { width: 24%; } }
.board th.team, .board td.team { text-align: left; }
.board td { font-family: var(--f-display); font-weight: 700; font-size: clamp(15px, 2.4vw, 22px); line-height: 1.15; text-align: center; padding: 1px 2px; }
.board td.team { font-family: var(--f-display); font-size: clamp(13px, 1.9vw, 17px); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; padding-right: 8px; overflow: hidden; text-overflow: ellipsis; }
.board td.team .bat { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); margin-right: 6px; vertical-align: middle; visibility: hidden; }
.board tr.batting td.team .bat { visibility: visible; }
.board td.now { color: var(--lamp); }
.board td.tot { color: var(--lamp); border-left: 2px solid rgba(255,255,255,.12); }
.board th.tot { border-left: 2px solid rgba(255,255,255,.12); }
.board td.blank { color: var(--board-dim); opacity: .35; }

/* Main columns */
.main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .main { grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); align-items: start; } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; min-width: 0; }
.panel h2 { font-family: var(--f-label); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

/* Situation */
.situ { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; }
.diamond { width: 100%; max-width: 200px; aspect-ratio: 1; justify-self: center; }
.diamond .base { cursor: pointer; }
.diamond .base rect { fill: var(--surface); stroke: var(--muted); stroke-width: 2.5; }
.diamond .base.on rect { fill: var(--lamp); stroke: var(--ink); }
.diamond .rname { font-family: var(--f-label); font-weight: 600; font-size: 13px; fill: var(--ink); }
.diamond .hit { fill: transparent; }
.count { display: grid; gap: 10px; }
.count .row { display: grid; gap: 3px; }
.count .lbl { font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--muted); }
.count .dots { display: flex; gap: 6px; }
.count .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--rule); }
.count .b .dot.on { background: var(--safe); border-color: var(--safe); }
.count .s .dot.on { background: var(--lamp); border-color: #c79400; }
.count .o .dot.on { background: var(--stitch); border-color: var(--stitch); }

.atbat { display: grid; gap: 2px; padding: 10px 0 4px; border-top: 1px solid var(--rule-soft); margin-top: 8px; }
.atbat .now { font-family: var(--f-display); font-weight: 800; font-size: 25px; line-height: 1.05; text-wrap: balance; }
.atbat .now small { font-family: var(--f-label); font-weight: 600; font-size: 16px; color: var(--muted); margin-right: 6px; }
.atbat .meta { color: var(--muted); font-size: 14px; }

/* Input pad */
.pad { display: grid; gap: 10px; margin-top: 10px; }
.group { display: grid; gap: 5px; }
.group .gl { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.keys { display: grid; gap: 5px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.key { min-height: 48px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); display: grid; place-content: center; text-align: center; padding: 4px; line-height: 1.05; }
.key b { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .02em; }
.key span { font-family: var(--f-label); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
.key:active { transform: translateY(1px); }
.key:disabled { opacity: .35; cursor: default; }
.key.pitch { background: var(--rule-soft); }
.key.on { background: var(--safe-soft); border-color: color-mix(in srgb, var(--safe) 35%, var(--rule)); }
.key.on b { color: var(--safe); }
.key.out { background: var(--stitch-soft); border-color: color-mix(in srgb, var(--stitch) 30%, var(--rule)); }
.key.out b { color: var(--stitch); }
.kc { display: inline-block; transform: scaleX(-1); }
.key .kc { font: inherit; color: inherit; letter-spacing: inherit; }

/* Scorebook */
.bookhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: transparent; min-height: 36px; font-size: 15px; padding: 0 14px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.bookscroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
table.book { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; }
table.book th, table.book td { border: 1px solid var(--rule-soft); }
table.book thead th { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--paper); padding: 6px 4px; position: sticky; top: 0; }
table.book th.inn.now { color: var(--ink-blue); }
table.book td.slot { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-align: center; width: 30px; color: var(--muted); }
table.book td.name { padding: 4px 10px 4px 8px; white-space: nowrap; font-weight: 600; min-width: 120px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
table.book tr.up td.name { color: var(--ink-blue); }
table.book tr.up td.slot { color: var(--ink-blue); }
table.book td.cell { width: 52px; min-width: 52px; height: 52px; padding: 2px; vertical-align: top; }
table.book td.cell .stack { display: flex; flex-direction: column; gap: 2px; }
table.book td.st { text-align: center; font-family: var(--f-label); font-weight: 600; font-size: 16px; width: 38px; }
table.book th.stat, table.book td.st.first { border-left: 2px solid var(--rule); }
table.book tfoot td { font-family: var(--f-label); font-weight: 700; font-size: 14px; text-align: center; background: var(--paper); padding: 4px; }
.mini { display: block; width: 46px; height: 46px; }
.mini .path { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.mini .ran { fill: none; stroke: var(--ink-blue); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.mini .scored { fill: var(--ink-blue); opacity: .22; }
.mini .code { font-family: var(--f-display); font-weight: 800; font-size: 15px; fill: var(--ink); }
.mini .outc { fill: none; stroke: var(--stitch); stroke-width: 1.6; }
.mini .outn { font-family: var(--f-label); font-weight: 700; font-size: 11px; fill: var(--stitch); }
.mini .note { font-family: var(--f-label); font-weight: 700; font-size: 9px; fill: var(--muted); }

.lower { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-top: 14px; }
@media (min-width: 700px) { .lower { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.pbp { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; display: grid; gap: 0; }
.pbp li { padding: 6px 0; border-bottom: 1px solid var(--rule-soft); font-size: 15px; display: grid; grid-template-columns: 48px 1fr; gap: 8px; }
.pbp li .inn { font-family: var(--f-label); font-weight: 700; color: var(--muted); font-size: 13px; padding-top: 2px; }
.pbp li .run { color: var(--safe); font-weight: 700; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; font-size: 14px; color: var(--muted); }
.legend b { font-family: var(--f-display); color: var(--ink); font-size: 16px; display: inline-block; min-width: 34px; }

/* Final banner */
.final { background: var(--lamp); color: #1b1400; border-radius: 8px; padding: 10px 14px; font-weight: 700; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.final b { font-family: var(--f-display); font-size: 24px; text-transform: uppercase; }

/* Sheets (overlays) */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 18, .5); z-index: 50; display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .scrim { place-items: center; } }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; width: 100%; max-width: 520px; max-height: calc(100% - 20px); overflow-y: auto; padding: 18px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.sheet h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 26px; text-transform: uppercase; }
.sheet p { margin: 0; color: var(--muted); }
.posgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.posgrid .key b { font-size: 22px; }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.field label { font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea, .field select { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); width: 100%; }
.field textarea { min-height: 200px; resize: vertical; line-height: 1.5; }
.two { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 520px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.check { display: flex; flex-direction: row-reverse; justify-content: space-between; gap: 16px; align-items: center; font-size: 15px; }
:root { --switch-on: #34c759; --switch-off: #d5dce3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --switch-on: #30d158; --switch-off: #3a4651; } }
:root[data-theme="dark"] { --switch-on: #30d158; --switch-off: #3a4651; }
input.switch, .check input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 31px; background: var(--switch-off); position: relative; flex: none; margin: 0; cursor: pointer; transition: background .2s; }
input.switch::after, .check input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transition: transform .2s; }
input.switch:checked, .check input[type=checkbox]:checked { background: var(--switch-on); }
input.switch:checked::after, .check input[type=checkbox]:checked::after { transform: translateX(20px); }
.setlist { border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); overflow: hidden; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px; border-top: 1px solid var(--rule-soft); cursor: pointer; }
.setrow:first-child { border-top: 0; }
.setrow b { display: block; font-weight: 600; }
.setrow small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 2px; }
.setrow select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }
.danger { background: var(--stitch); color: #fff; border-color: var(--stitch); }
.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Views: Game / Season / Roster */
.nav { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.nav button { border: 0; background: transparent; min-height: 40px; padding: 0 14px; font-size: 15px; font-weight: 600; }
.nav button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.view { display: grid; gap: 14px; }
.empty { text-align: center; padding: 40px 16px; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; text-transform: uppercase; color: var(--ink); letter-spacing: .02em; margin: 0; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.banner { background: var(--rule-soft); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.banner .spacer { flex: 1; }
.gamebar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.gamebar .spacer { flex: 1; }

/* Stats tables */
.sbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.sbar .spacer { flex: 1; }
.sbar label { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sbar select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.tscroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
table.stats { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
table.stats th, table.stats td { padding: 8px 8px; text-align: right; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; }
table.stats th { font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
table.stats th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
table.stats th.sorted { color: var(--ink-blue); }
table.stats th:first-child, table.stats td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
table.stats th:first-child { background: var(--paper); }
table.stats td.num { color: var(--muted); font-family: var(--f-label); font-weight: 600; width: 36px; }
table.stats td.best { color: var(--safe); font-weight: 700; }
table.stats tfoot td { font-weight: 700; background: var(--paper); border-top: 2px solid var(--rule); border-bottom: 0; }
table.stats tfoot td:first-child { background: var(--paper); }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; font-size: 14px; color: var(--muted); margin-top: 12px; }
.gloss b { color: var(--ink); font-family: var(--f-label); font-size: 15px; margin-right: 4px; }
.lower3 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .lower3 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; } }
.games { list-style: none; margin: 0; padding: 0; display: grid; }
.games li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule-soft); flex-wrap: wrap; }
.games .res { font-family: var(--f-display); font-weight: 800; font-size: 20px; width: 28px; }
.games .res.w { color: var(--safe); } .games .res.l { color: var(--stitch); } .games .res.t { color: var(--muted); }
.games .who { flex: 1; min-width: 0; }
.games .who small { display: block; color: var(--muted); font-size: 13px; }
.games .tbtn { min-height: 36px; padding: 0 10px; font-size: 14px; }

/* Roster + lineup builder */
.rows { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 84px 70px 40px; gap: 6px; align-items: center; }
.prow.lu { grid-template-columns: 26px minmax(0, 1fr) 84px 36px 36px 36px; }
.prow .n { font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
.prow input, .prow select { font: inherit; font-size: 15px; padding: 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); width: 100%; min-width: 0; }
.prow .ibtn { min-height: 34px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); padding: 0; }
.prow.ros { grid-template-columns: 52px minmax(0, 1fr) minmax(0, 260px) 60px 40px; }
.prow.ros .posset { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 640px) {
  .prow.ros { grid-template-columns: 52px minmax(0, 1fr) 60px 40px; padding-bottom: 8px; border-bottom: 1px solid var(--rule-soft); }
  .prow.ros .posset { grid-column: 1 / -1; order: 5; }
  .prow.ros.head .posset { display: none; }
}
.lusum { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.lusum.warn { color: var(--stitch); }
.bench { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--muted); }
.chipbtn { min-height: 34px; padding: 0 10px; border-radius: 17px; border: 1px dashed var(--rule); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 10px; flex: none; }
.stepper b { font-family: var(--f-display); font-size: 22px; min-width: 24px; text-align: center; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); font-size: 20px; line-height: 1; padding: 0; }

<script>
(function () {
"use strict";

/* =====================================================================
   Constants
   ===================================================================== */
const KEY = "dugout-scorebook.v2";
const POS = [null, "P", "C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "LCF", "RCF", "SF"];   // scorebook numbers: 10 = left-center, 11 = right-center, 12 = short fielder
const POS_NAME = [null, "Pitcher", "Catcher", "First base", "Second base", "Third base", "Shortstop", "Left field", "Center field", "Right field", "Left-center field", "Right-center field", "Short field"];
const FIELD_POS = ["P", "C", "1B", "2B", "3B", "SS", "LF", "LCF", "CF", "RCF", "RF", "SF"];
const LINEUP_POS = [...FIELD_POS, "EH"];                       // EH = extra hitter: bats, doesn't field
const posList = pl => pl ? [pl.pos, ...(pl.alt || [])].filter((x, i, a) => x && LINEUP_POS.includes(x) && a.indexOf(x) === i) : [];
const NEEDS_POS = { GO: "Who fielded the grounder?", FO: "Who caught the fly ball?", LO: "Who caught the liner?", PO: "Who caught the pop-up?", SF: "Who caught the sacrifice fly?", E: "Who made the error?" };
const HIT_CODES = ["1B", "2B", "3B", "HR"];
const BASES_FOR = { "1B": 1, "2B": 2, "3B": 3, HR: 4 };
const BB_OF = { GO: "GB", FO: "FB", LO: "LD", PO: "PU", SF: "FB", DP: "GB", FC: "GB" };   // batted-ball type implied by an out
const LEFT_SIDE = new Set([5, 6, 7, 10]), RIGHT_SIDE = new Set([3, 4, 9, 11]);                    // for pull / opposite field

const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* =====================================================================
   Storage
   store = { team: {name, players:[{id,name,num,pos,bats}]}, games: [...], currentId }
   game  = { id, date, opponent, ourSide (0 visitors / 1 home), settings, lineups:[[{pid,name,pos}],[...]], events:[], done }
   ===================================================================== */
function blankStore() { return { v: 2, sample: false, team: { name: "My Team", players: [] }, games: [], currentId: null }; }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.team && Array.isArray(d.games)) return d; } } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

// Created at the bottom of the script, once every function below exists.
let store = null;
const ui = {
  view: "stats", sheet: null, sound: false, bookTeam: null, peekId: null,
  table: "std", sort: { k: "OPS", d: -1 }, minPA: 0, incCur: true, confirm: null, draft: null, bb: null, msg: ""
};

const player = pid => store.team.players.find(p => p.id === pid);
const entryName = x => (x.pid && player(x.pid) ? player(x.pid).name : x.name) || "";
const teamNames = g => g.ourSide === 0 ? [store.team.name, g.opponent || "Opponent"] : [g.opponent || "Opponent", store.team.name];
const modeOf = g => g.settings.mode === "dugout" ? "dugout" : "scorekeeper";
const countOn = g => g.settings.trackCount !== false;
const curGame = () => store.games.find(g => g.id === store.currentId) || null;
const viewGame = () => ui.peekId ? store.games.find(g => g.id === ui.peekId) : curGame();

/* =====================================================================
   Game engine: replay a game's event log into a state.
   Stats are always recomputed from the raw plays, so new metrics apply
   to every game ever scored.
   ===================================================================== */
function blankStat() {
  return { PA: 0, AB: 0, H: 0, "1B": 0, "2B": 0, "3B": 0, HR: 0, TB: 0, R: 0, RBI: 0, BB: 0, HBP: 0, K: 0, SF: 0, SB: 0, ROE: 0,
           RAB: 0, RH: 0, GB: 0, LD: 0, FB: 0, PU: 0, PULL: 0, CENT: 0, OPPO: 0 };
}
function fresh(g) {
  const s = {
    inning: 1, half: 0, outs: 0, balls: 0, strikes: 0, bases: [null, null, null],
    order: [0, 0], runs: [[0], []], hits: [0, 0], errors: [0, 0],
    book: [[], []], stats: [{}, {}], field: [{}, {}],
    lu: g.lineups.map(l => l.map(x => Object.assign({}, x))),
    final: false, log: [], fx: {}
  };
  resetCount(s, g);
  return s;
}
function resetCount(s, g) { s.balls = g.settings.startCount ? 1 : 0; s.strikes = g.settings.startCount ? 1 : 0; }
const lineLen = (s, t) => s.lu[t].length || 9;
const curSlot = s => s.order[s.half] % lineLen(s, s.half);
const occ = (s, t, slot) => s.lu[t][slot] || { pid: null, name: "Batter " + (slot + 1), pos: "" };
const keyOf = (x, t, slot) => x.pid ? "p:" + x.pid : "s:" + t + ":" + slot;
const nameAt = (s, t, slot) => entryName(occ(s, t, slot));
const total = (s, t) => s.runs[t].reduce((a, b) => a + (b || 0), 0);
function stat(s, t, key) { return s.stats[t][key] || (s.stats[t][key] = blankStat()); }
function fstat(s, t, key) { return s.field[t][key] || (s.field[t][key] = { PL: 0, E: 0 }); }
function cellOf(s, r) { return s.book[r.team][r.cell]; }
function log(s, text) { s.log.push({ inn: (s.half ? "B" : "T") + s.inning, text }); }

function scoreRunner(s, g, r) {
  s.runs[r.team][s.inning - 1] = (s.runs[r.team][s.inning - 1] || 0) + 1;
  const c = cellOf(s, r); c.base = 4; c.scored = true;
  stat(s, r.team, r.key).R++;
  s.fx.runs = (s.fx.runs || 0) + 1;
  if (s.half === 1 && s.inning >= g.settings.innings && total(s, 1) > total(s, 0)) s.final = true;
}
function outRunner(s, r) { s.outs++; cellOf(s, r).out = s.outs; s.fx.out = true; }
function move(s, from, to) { s.bases[to] = s.bases[from]; s.bases[from] = null; cellOf(s, s.bases[to]).base = to + 1; }

function endHalf(s, g) {
  s.fx.side = true;
  s.bases = [null, null, null]; s.outs = 0; resetCount(s, g);
  const N = g.settings.innings, a = total(s, 0), h = total(s, 1);
  if (s.half === 0) {
    if (s.inning >= N && h > a) { s.final = true; return; }
    s.half = 1; s.runs[1][s.inning - 1] = 0;
  } else {
    if (s.inning >= N && a !== h) { s.final = true; return; }
    s.half = 0; s.inning++; s.runs[0][s.inning - 1] = 0;
  }
}

const NO_POS_CODE = { GO: "GO", FO: "F", LO: "L", PO: "P", SF: "SF", E: "E" };
const NO_POS_VERB = { GO: "grounds out", FO: "flies out", LO: "lines out", PO: "pops out", SF: "hits a sacrifice fly", E: "reaches on an error" };
function codeFor(r, p) {
  if (!p && NO_POS_CODE[r]) return NO_POS_CODE[r];
  switch (r) {
    case "GO": return p === 3 ? "3U" : p + "-3";
    case "FO": return "F" + p;
    case "LO": return "L" + p;
    case "PO": return "P" + p;
    case "SF": return "SF" + p;
    case "E": return "E" + p;
    case "KC": return "K";
    default: return r;
  }
}
const VERB = {
  "1B": "singles", "2B": "doubles", "3B": "triples", HR: "homers", BB: "walks", HBP: "is hit by a pitch",
  K: "strikes out swinging", KC: "strikes out looking", FC: "reaches on a fielder's choice", DP: "grounds into a double play"
};
function verbFor(r, p) {
  const where = p ? POS_NAME[p].toLowerCase() : "";
  if (VERB[r]) return VERB[r] + (p && HIT_CODES.includes(r) ? " to " + where : "");
  if (!p && NO_POS_VERB[r]) return NO_POS_VERB[r];
  return { GO: "grounds out to " + where, FO: "flies out to " + where, LO: "lines out to " + where, PO: "pops out to " + where,
           SF: "hits a sacrifice fly to " + where, E: "reaches on an error by the " + where }[r] || r;
}
function fielderAt(s, t, p) {
  const i = s.lu[t].findIndex(x => x.pos === POS[p]);
  return i < 0 ? null : keyOf(s.lu[t][i], t, i);
}

function plateAppearance(s, g, r, p, bb, foulK) {
  const bt = s.half, ft = 1 - bt, slot = curSlot(s), who = occ(s, bt, slot), key = keyOf(who, bt, slot), st = stat(s, bt, key);
  const risp = !!(s.bases[1] || s.bases[2]);
  const cell = { slot, inning: s.inning, code: codeFor(r, p), base: 0, scored: false, out: 0, looking: r === "KC", notes: [] };
  if (foulK) cell.notes.push("FOUL");
  s.book[bt].push(cell);
  const me = { team: bt, cell: s.book[bt].length - 1, slot, key };
  let runs = 0;
  const sc = x => { scoreRunner(s, g, x); runs++; };
  const advAll = n => { for (let b = 2; b >= 0; b--) { const x = s.bases[b]; if (!x) continue; s.bases[b] = null; const nb = b + n; if (nb >= 3) sc(x); else { s.bases[nb] = x; cellOf(s, x).base = nb + 1; } } };
  const forceAll = () => { if (!s.bases[0]) return; if (s.bases[1]) { if (s.bases[2]) { const x = s.bases[2]; s.bases[2] = null; sc(x); } move(s, 1, 2); } move(s, 0, 1); };
  const put = b => { s.bases[b - 1] = me; cell.base = b; };
  const hit = HIT_CODES.includes(r);
  const ab = !["BB", "HBP", "SF"].includes(r);

  // --- counting stats for sabermetrics ---
  st.PA++;
  if (ab) { st.AB++; if (risp) st.RAB++; }
  if (hit) { st.H++; st[r]++; st.TB += BASES_FOR[r]; s.hits[bt]++; s.fx.hit = true; if (risp) st.RH++; }
  if (r === "E") st.ROE++;
  const type = hit ? bb : BB_OF[r];
  if (type) st[type]++;
  if (p && (hit || NEEDS_POS[r])) {
    const bats = who.pid && player(who.pid) ? player(who.pid).bats : "";
    if (bats === "R" || bats === "L") {
      const side = LEFT_SIDE.has(p) ? "L" : RIGHT_SIDE.has(p) ? "R" : "C";
      const pullSide = bats === "R" ? "L" : "R";       // a right-handed batter pulls to left field
      if (side === "C") st.CENT++; else if (side === pullSide) st.PULL++; else st.OPPO++;
    }
    const f = fielderAt(s, ft, p);
    if (f) { if (r === "E") fstat(s, ft, f).E++; else if (!hit) fstat(s, ft, f).PL++; }
  }

  switch (r) {
    case "1B": advAll(1); put(1); break;
    case "2B": advAll(2); put(2); break;
    case "3B": advAll(3); put(3); break;
    case "HR": advAll(3); sc(me); s.fx.hr = true; break;
    case "BB": case "HBP": forceAll(); put(1); st[r]++; s.fx.walk = true; break;
    case "K": case "KC": outRunner(s, me); st.K++; s.fx.k = true; break;
    case "GO": case "FO": case "LO": case "PO": outRunner(s, me); break;
    case "SF": outRunner(s, me); st.SF++; if (s.outs < 3 && s.bases[2]) { const x = s.bases[2]; s.bases[2] = null; sc(x); } break;
    case "E": forceAll(); put(1); s.errors[ft]++; break;
    case "FC": {
      const lead = s.bases[0] ? 0 : [2, 1].find(b => s.bases[b]);
      if (lead !== undefined) { const x = s.bases[lead]; s.bases[lead] = null; outRunner(s, x); }
      if (s.outs < 3) { forceAll(); put(1); }
      break;
    }
    case "DP": {
      const lead = s.bases[0] ? 0 : [2, 1].find(b => s.bases[b]);
      if (lead !== undefined) { const x = s.bases[lead]; s.bases[lead] = null; outRunner(s, x); }
      if (s.outs < 3) outRunner(s, me);
      break;
    }
  }
  if (!["E", "DP"].includes(r)) st.RBI += runs;
  log(s, esc(entryName(who)) + " " + verbFor(r, p) + (foulK ? " (foul with two strikes)" : "") + "." + (runs ? ` <span class="run">${runs} run${runs > 1 ? "s" : ""} score${runs > 1 ? "" : "s"}.</span>` : ""));
  s.order[bt]++;
  resetCount(s, g);
  if (s.outs >= 3 && !s.final) endHalf(s, g);
}

function pitch(s, g, k) {
  if (k === "B") { s.balls++; if (s.balls >= 4) plateAppearance(s, g, "BB"); }
  else if (k === "F") { if (s.strikes < 2) s.strikes++; else if (g.settings.foulOut) plateAppearance(s, g, "K", null, null, true); }
  else { s.strikes++; if (s.strikes >= 3) plateAppearance(s, g, k === "CS" ? "KC" : "K"); }
}

function runnerMove(s, g, b, a) {
  const x = s.bases[b]; if (!x) return;
  const who = esc(nameAt(s, x.team, x.slot));
  if (a === "out") {
    s.bases[b] = null; outRunner(s, x); log(s, who + " is out on the bases.");
    if (s.outs >= 3) endHalf(s, g);
    return;
  }
  if (a === "sb") { stat(s, x.team, x.key).SB++; cellOf(s, x).notes.push("SB"); }
  if (a === "score" || b === 2) {
    s.bases[b] = null; scoreRunner(s, g, x);
    log(s, who + (a === "sb" ? " steals home." : " scores.") + ' <span class="run">1 run scores.</span>');
  } else if (!s.bases[b + 1]) {
    move(s, b, b + 1);
    log(s, who + (a === "sb" ? " steals " : " advances to ") + ["", "second", "third"][b + 1] + ".");
  }
}

// Dugout mode: the other team's half-inning is scored with a few big buttons
// instead of batter by batter.
function quickEvent(s, g, k) {
  const bt = s.half, team = esc(teamNames(g)[bt]);
  if (k === "run") {
    s.runs[bt][s.inning - 1] = (s.runs[bt][s.inning - 1] || 0) + 1; s.fx.runs = 1;
    log(s, `${team} score a run. <span class="run">1 run scores.</span>`);
    if (s.half === 1 && s.inning >= g.settings.innings && total(s, 1) > total(s, 0)) s.final = true;
  } else if (k === "out") {
    s.outs++; s.fx.out = true; log(s, `Out ${s.outs}.`);
    if (s.outs >= 3) endHalf(s, g);
  } else if (k === "hit") { s.hits[bt]++; log(s, `${team} get a hit.`); }
  else if (k === "err") { s.errors[1 - bt]++; log(s, `Error by ${esc(teamNames(g)[1 - bt])}.`); }
  else if (k === "end") { log(s, "Half-inning ended."); endHalf(s, g); }
}

function substitute(s, e) {
  s.lu[e.team][e.slot] = { pid: e.pid || null, name: e.name, pos: e.pos };
  log(s, `Lineup: ${esc(entryName(s.lu[e.team][e.slot]))} bats ${ordinal(e.slot + 1)}${e.pos ? ", plays " + esc(e.pos) : ""}.`);
}

function derive(g) {
  const s = fresh(g);
  for (const e of g.events) {
    if (e.t === "sub") { substitute(s, e); continue; }
    if (s.final) break;
    s.fx = { bat: s.half };
    if (e.t === "pitch") pitch(s, g, e.k);
    else if (e.t === "pa") plateAppearance(s, g, e.r, e.p, e.bb);
    else if (e.t === "run") runnerMove(s, g, e.b, e.a);
    else if (e.t === "quick") quickEvent(s, g, e.k);
  }
  return s;
}

/* =====================================================================
   Season stats (sabermetrics)
   ===================================================================== */
function season() {
  const rows = {}, rec = { W: 0, L: 0, T: 0 };
  let games = 0;
  const row = pid => rows[pid] || (rows[pid] = Object.assign({ pid, G: 0, PL: 0, E: 0, pos: {} }, blankStat()));
  for (const g of store.games) {
    const live = g.id === store.currentId;
    if (!g.done && !(live && ui.incCur)) continue;
    games++;
    const s = derive(g), t = g.ourSide;
    if (g.done) { const us = total(s, t), them = total(s, 1 - t); rec[us > them ? "W" : us < them ? "L" : "T"]++; }
    for (const [k, st] of Object.entries(s.stats[t])) {
      if (!k.startsWith("p:")) continue;
      const r = row(k.slice(2));
      if (st.PA) r.G++;
      for (const f in st) r[f] += st[f];
    }
    for (const [k, f] of Object.entries(s.field[t])) {
      if (!k.startsWith("p:")) continue;
      const r = row(k.slice(2)); r.PL += f.PL; r.E += f.E;
    }
    const seen = new Set();
    const addPos = x => { if (x.pid && x.pos && x.pos !== "Bench" && !seen.has(x.pid + x.pos)) { seen.add(x.pid + x.pos); const r = row(x.pid); r.pos[x.pos] = (r.pos[x.pos] || 0) + 1; } };
    g.lineups[t].forEach(addPos);
    g.events.forEach(e => { if (e.t === "sub" && e.team === t) addPos(e); });
  }
  const list = Object.values(rows).map(r => {
    const p = player(r.pid);
    return withRates(Object.assign(r, { name: p ? p.name : "Former player", num: p ? p.num : "" }));
  });
  return { list, games, rec };
}
function withRates(t) {
  const d = (a, b) => b > 0 ? a / b : null;
  t.AVG = d(t.H, t.AB);
  t.OBP = d(t.H + t.BB + t.HBP, t.AB + t.BB + t.HBP + t.SF);
  t.SLG = d(t.TB, t.AB);
  t.OPS = t.OBP != null && t.SLG != null ? t.OBP + t.SLG : null;
  t.ISO = t.SLG != null ? t.SLG - t.AVG : null;
  t.BABIP = d(t.H - t.HR, t.AB - t.K - t.HR + t.SF);
  // wOBA with MLB-style linear weights. Softball has no published weights, so read it as a relative ranking.
  t.wOBA = d(.69 * t.BB + .72 * t.HBP + .88 * t["1B"] + 1.25 * t["2B"] + 1.59 * t["3B"] + 2.05 * t.HR, t.AB + t.BB + t.SF + t.HBP);
  t.Kp = d(t.K, t.PA); t.BBp = d(t.BB, t.PA); t.BBK = d(t.BB, t.K);
  t.RISP = d(t.RH, t.RAB);
  t.RC = t.AB + t.BB + t.HBP > 0 ? (t.H + t.BB + t.HBP) * t.TB / (t.AB + t.BB + t.HBP) : null;
  t.BIP = t.GB + t.LD + t.FB + t.PU;
  t.GBp = d(t.GB, t.BIP); t.LDp = d(t.LD, t.BIP); t.FBp = d(t.FB, t.BIP); t.PUp = d(t.PU, t.BIP);

              <button class="tbtn" data-act="gamemenu">Game Settings</button>`}`;
}

function renderBoard() {

    h += `<tr class="${live && S.half === t ? "batting" : ""}"><td class="team"><span class="bat"></span>${esc(names[t])}</td>`;

function dots(n, on) { let h = ""; for (let i = 0; i < n; i++) h += `<span class="dot ${i < on ? "on" : ""}"></span>`; return h; }
function renderCount() {
  $("count").innerHTML = `
    ${countOn(G) && !quickHalf() ? `<div class="row b"><span class="lbl">BALLS</span><div class="dots">${dots(3, S.balls)}</div></div>
    <div class="row s"><span class="lbl">STRIKES</span><div class="dots">${dots(2, S.strikes)}</div></div>` : ""}
    <div class="row o"><span class="lbl">OUTS</span><div class="dots">${dots(2, S.outs)}</div></div>`;
}

function todayLine(t, slot) {
  const st = S.stats[t][keyOf(occ(S, t, slot), t, slot)];
  if (!st || !st.PA) return "First trip to the plate today";
  const bits = [`${st.H}-for-${st.AB}`];
  if (st.HR) bits.push(st.HR + " HR"); if (st.RBI) bits.push(st.RBI + " RBI"); if (st.BB) bits.push(st.BB + " BB"); if (st.K) bits.push(st.K + " K");
  return "Today: " + bits.join(", ");
}
function renderAtBat() {

function mini(c) {
  const pts = [[26, 48], [48, 26], [26, 4], [4, 26], [26, 48]];
  const ran = c.base > 0 ? `<polyline class="ran" points="${pts.slice(0, c.base + 1).map(p => p.join(",")).join(" ")}" />` : "";
  const code = c.looking ? `<text class="code" x="26" y="31" text-anchor="middle" transform="translate(52 0) scale(-1 1)">K</text>` : `<text class="code" x="26" y="31" text-anchor="middle">${esc(c.code)}</text>`;
  const out = c.out ? `<circle class="outc" cx="44" cy="44" r="7" /><text class="outn" x="44" y="48" text-anchor="middle">${c.out}</text>` : "";
  const notes = c.notes.length ? `<text class="note" x="2" y="9">${esc(c.notes.join(" "))}</text>` : "";
  return `<svg class="mini" viewBox="0 0 52 52" aria-label="${esc(c.code)}${c.scored ? ", scored" : ""}${c.out ? ", out " + c.out : ""}">
    <path class="path" d="M26 48 L48 26 L26 4 L4 26 Z" />${c.scored ? '<path class="scored" d="M26 48 L48 26 L26 4 L4 26 Z" />' : ""}${ran}${code}${out}${notes}</svg>`;
}
function renderBook() {

/* ---------- Season view ---------- */
function renderStats() {
  const { list, games, rec } = season();
  const tdef = TABLES[ui.table] || TABLES.std;
  const qualified = list.filter(r => r.PA >= ui.minPA && (ui.table !== "fld" || r.PL + r.E > 0 || r.POS));
  const sk = ui.sort.k, dir = ui.sort.d;
  qualified.sort((a, b) => {
    if (sk === "name") return dir * a.name.localeCompare(b.name);
    const va = a[sk], vb = b[sk];
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return typeof va === "string" ? dir * va.localeCompare(vb) : dir * (va - vb);
  });
  const best = {};
  tdef.cols.forEach(([k, f, better]) => {
    if (!better || qualified.length < 2) return;
    const vals = qualified.map(r => r[k]).filter(v => v != null);
    if (vals.length) best[k] = better > 0 ? Math.max(...vals) : Math.min(...vals);
  });
  const teamTot = withRates(list.reduce((a, r) => { for (const k in blankStat()) a[k] += r[k]; a.PL += r.PL; a.E += r.E; return a; }, Object.assign({ PL: 0, E: 0, pos: {} }, blankStat())));
  teamTot.G = games;

  const th = (k, label) => `<th class="${sk === k ? "sorted" : ""}"><button data-act="sort" data-v="${k}">${label}${sk === k ? (dir < 0 ? " ▼" : " ▲") : ""}</button></th>`;
  let h = `<thead><tr>${th("name", "Player")}${tdef.cols.map(([k, , , label]) => th(k, label || k)).join("")}</tr></thead><tbody>`;
  h += qualified.map(r => `<tr><td><span style="color:var(--muted);font-family:var(--f-label);font-weight:600;margin-right:6px">${esc(r.num)}</span>${esc(r.name)}</td>` +
    tdef.cols.map(([k, f]) => `<td class="${best[k] != null && r[k] === best[k] ? "best" : ""}">${fmt[f](r[k])}</td>`).join("") + "</tr>").join("");
  if (!qualified.length) h += `<tr><td colspan="${tdef.cols.length + 1}" style="text-align:left;color:var(--muted)">No stats yet. Finish a game and choose “Save to season”, and the numbers appear here.</td></tr>`;
  h += `</tbody><tfoot><tr><td>Team</td>${tdef.cols.map(([k, f]) => `<td>${k === "POS" ? "" : fmt[f](teamTot[k])}</td>`).join("")}</tr></tfoot>`;

  const cur = curGame();
  const minQual = games * 2;
  const leaderCats = [["AVG", "avg"], ["OPS", "avg"], ["wOBA", "avg"], ["HR", "int"], ["RBI", "int"], ["SB", "int"]];
  const leaders = leaderCats.map(([k, f]) => {
    const pool = list.filter(r => r[k] != null && (f === "int" || r.PA >= minQual)).sort((a, b) => b[k] - a[k]);
    const top = pool[0];
    return `<li><span class="res" style="width:auto;min-width:56px;font-size:16px">${k}</span><span class="who">${top && top[k] > 0 ? esc(top.name) : "—"}</span><b>${top && top[k] > 0 ? fmt[f](top[k]) : ""}</b></li>`;
  }).join("");

  const gameItems = store.games.slice().sort((a, b) => b.date.localeCompare(a.date)).map(g => {
    const s = derive(g), us = total(s, g.ourSide), them = total(s, 1 - g.ourSide);
    const live = g.id === store.currentId;
    const res = live ? "" : us > them ? "W" : us < them ? "L" : "T";
    const confirmDel = ui.confirm === "del:" + g.id;
    return `<li><span class="res ${res.toLowerCase()}">${live ? "●" : res}</span>
      <span class="who">${g.ourSide ? "vs" : "at"} ${esc(g.opponent)} <b>${us}–${them}</b><small>${esc(g.date)}${live ? " · in progress" : ""}</small></span>
      ${live ? `<button class="tbtn" data-act="resume">Resume</button>` : `<button class="tbtn" data-act="peek" data-v="${g.id}">View</button>`}
      <button class="tbtn ${confirmDel ? "danger" : ""}" data-act="delgame" data-v="${g.id}">${confirmDel ? "Confirm delete" : "Delete"}</button></li>`;
  }).join("");

  $("view").innerHTML = `
    <section class="panel">
      <div class="sbar">
        <h2 style="margin:0">${esc(store.team.name)} · ${games} game${games === 1 ? "" : "s"} · ${rec.W}–${rec.L}${rec.T ? "–" + rec.T : ""}</h2>
        <span class="spacer"></span>
        <div class="tabs" role="tablist">${Object.entries(TABLES).map(([k, t]) => `<button role="tab" aria-selected="${ui.table === k}" data-act="table" data-v="${k}">${t.label}</button>`).join("")}<button role="tab" aria-selected="${ui.table === "lu"}" data-act="table" data-v="lu">Lineups</button></div>
      </div>
      <div class="sbar">
        <label for="minPA">Min. plate appearances <select id="minPA" data-ch="minPA">${[0, 5, 10, 20, 40].map(n => `<option ${n === ui.minPA ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        ${cur ? `<label><input type="checkbox" class="switch" id="incCur" data-ch="incCur" ${ui.incCur ? "checked" : ""}> Include today's game in progress</label>` : ""}
        <span class="spacer"></span>
        <button class="tbtn" data-act="backup">Export &amp; backup</button>
      </div>
      ${ui.table === "lu" ? lineupHistory() : `<div class="tscroll"><table class="stats">${h}</table></div>
      <div class="gloss">${GLOSS[ui.table].map(([k, v]) => `<div><b>${k}</b>${v}</div>`).join("")}</div>`}
    </section>
    <div class="lower3">
      <section class="panel"><h2>Games</h2>${gameItems ? `<ul class="games">${gameItems}</ul>` : `<p style="color:var(--muted);margin:0">No games yet.</p>`}
        ${cur ? "" : `<div style="margin-top:12px"><button class="tbtn primary" data-act="newgame" ${store.team.players.length ? "" : "disabled"}>Start a game</button></div>`}</section>
      <section class="panel"><h2>Team leaders</h2><ul class="games">${leaders}</ul>
        <p style="color:var(--muted);font-size:13px;margin:8px 0 0">Rate stats need ${minQual} plate appearances (2 per team game) to qualify.</p></section>
    </div>`;
}

/* ---------- Lineup history: who batted where and played what, game by game ---------- */
function lineupHistory() {
  const games = store.games.filter(g => g.done || (g.id === store.currentId && ui.incCur)).sort((a, b) => a.date.localeCompare(b.date));
  const rows = {};
  const row = pid => rows[pid] || (rows[pid] = { pid, cells: {}, starts: 0, slots: [] });
  games.forEach(g => {
    const t = g.ourSide, map = {};
    g.lineups[t].forEach((x, i) => { if (x.pid) map[x.pid] = { slot: i + 1, pos: [x.pos], sub: false }; });
    g.events.forEach(e => {
      if (e.t !== "sub" || e.team !== t || !e.pid) return;
      const m = map[e.pid];
      if (m) { if (m.pos[m.pos.length - 1] !== e.pos) m.pos.push(e.pos); }
      else map[e.pid] = { slot: e.slot + 1, pos: [e.pos], sub: true };
    });
    for (const [pid, m] of Object.entries(map)) { const r = row(pid); r.cells[g.id] = m; if (!m.sub) { r.starts++; r.slots.push(m.slot); } }
  });
  store.team.players.forEach(p => row(p.id));
  const list = Object.values(rows).map(r => {
    const pl = player(r.pid);
    return Object.assign(r, { name: pl ? pl.name : "Former player", num: pl ? pl.num : "", avg: r.slots.length ? r.slots.reduce((a, b) => a + b, 0) / r.slots.length : 99 });
  }).sort((a, b) => a.avg - b.avg);
  const md = d => { const [, m, dd] = d.split("-"); return +m + "/" + +dd; };
  if (!games.length) return `<p style="color:var(--muted)">Lineups from each game show up here once games are saved to the season.</p>`;
  let h = `<thead><tr><th>Player</th><th>Starts</th>${games.map(g => `<th><button data-act="${g.id === store.currentId ? "resume" : "peek"}" data-v="${g.id}" title="${esc(g.opponent)}">${md(g.date)}<br><span style="font-weight:500;text-transform:none">${esc(g.opponent.split(" ")[0])}</span></button></th>`).join("")}</tr></thead><tbody>`;
  h += list.map(r => `<tr><td><span style="color:var(--muted);font-family:var(--f-label);font-weight:600;margin-right:6px">${esc(r.num)}</span>${esc(r.name)}</td><td>${r.starts}</td>${games.map(g => {
    const m = r.cells[g.id];
    return `<td>${m ? `${m.slot} · ${esc(m.pos.join("→"))}${m.sub ? " <small>(sub)</small>" : ""}` : `<span style="color:var(--muted)">—</span>`}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="tscroll"><table class="stats lu">${h}</tbody></table></div>
    <p class="gloss" style="display:block">Each cell is batting spot · position. An arrow marks a position change during the game, and “(sub)” means the player came off the bench. A dash means they didn't play. Tap a date to open that game.</p>`;
}

function defaultRows() {
  const last = store.games.slice().reverse().find(g => g.lineups[g.ourSide].some(x => x.pid));
  let rows = last ? last.lineups[last.ourSide].filter(x => player(x.pid)).map(x => ({ pid: x.pid, pos: LINEUP_POS.includes(x.pos) ? x.pos : "" })) : [];
  if (!rows.length) rows = store.team.players.map(p => ({ pid: p.id, pos: "" }));
  rows.forEach((r, i) => { if (!r.pos || takenBy(rows.slice(0, i), -1).has(r.pos)) r.pos = firstOpenPos(rows.slice(0, i), -1, player(r.pid)); });

}
function openNewGame() {

    mode: (store.prefs && store.prefs.mode) || "dugout", trackCount: !(store.prefs && store.prefs.trackCount === false), rows: defaultRows(), opp: "" };

function startGame() {

  if (!d.opponent.trim()) { ui.msg = "Enter the opponent's name."; renderSheet(); return; }
  if (!ours.length) { ui.msg = "Pick at least one player for your batting order."; renderSheet(); return; }
  const clash = lineupError(d.rows); if (clash) { ui.msg = clash; renderSheet(); return; }
  const theirs = d.opp.split("\n").map(x => x.trim()).filter(Boolean).map(name => ({ pid: null, name, pos: "" }));
  const lineups = d.ourSide === 0 ? [ours, theirs] : [theirs, ours];
  const g = { id: uid(), date: d.date || today(), opponent: d.opponent.trim(), ourSide: d.ourSide,
              settings: { innings: d.innings, startCount: d.startCount, foulOut: d.foulOut, askHits: d.askHits, mode: d.mode, trackCount: d.trackCount }, lineups, events: [], done: false };
  store.prefs = Object.assign({}, store.prefs, { askHits: d.askHits, mode: d.mode, trackCount: d.trackCount });
  store.games.push(g); store.currentId = g.id;

}
function openLineups() {
  const t = G.ourSide;
  ui.draft = { rows: S.lu[t].map(x => ({ pid: x.pid, pos: x.pos })), opp: S.lu[1 - t].map(x => x.name).join("\n") };

function saveLineups() {
  readDraftRows();
  const g = curGame(), d = ui.draft, t = g.ourSide;
  const clash = lineupError(d.rows); if (clash) { ui.msg = clash; renderSheet(); return; }
  const ours = d.rows.filter(r => player(r.pid)).map(r => ({ pid: r.pid, name: player(r.pid).name, pos: r.pos }));
  const theirs = d.opp.split("\n").map(x => x.trim()).filter(Boolean).map(name => ({ pid: null, name, pos: "" }));
  if (!g.events.length) {
    g.lineups[t] = ours; g.lineups[1 - t] = theirs;

    ours.forEach((x, i) => { const c = S.lu[t][i]; if (!c || c.pid !== x.pid || c.pos !== x.pos) g.events.push({ t: "sub", team: t, slot: i, pid: x.pid, name: x.name, pos: x.pos }); });

  }

}

function saveGameMenu() { applyGameMenu(); closeSheet(); }
function applyGameMenu() {
  readDraftRows();
  const g = curGame(), d = ui.draft; if (!g || !d) return;
  g.opponent = d.opponent.trim() || g.opponent;
  Object.assign(g.settings, { innings: d.innings, startCount: d.startCount, foulOut: d.foulOut, askHits: d.askHits, mode: d.mode, trackCount: d.trackCount });
  store.prefs = Object.assign({}, store.prefs, { askHits: d.askHits, mode: d.mode, trackCount: d.trackCount });
  ui.bookTeam = null; save(); render();
}
function endGame() {
  const g = curGame(); if (!g) return;
  g.done = true; store.currentId = null;
  save(); ui.sheet = null; ui.draft = null; ui.view = "stats"; render();
}

function download(name, text, type) {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}
function seasonCSV() {
  const { list } = season();
  const cols = [["Player", r => r.name], ["Num", r => r.num]];
  const seen = new Set();
  Object.values(TABLES).forEach(t => t.cols.forEach(([k, f, , label]) => { if (!seen.has(k)) { seen.add(k); cols.push([label || k, r => f === "txt" ? (r[k] || "") : fmt[f](r[k]).replace("—", "")]); } }));
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  return [cols.map(c => q(c[0])).join(",")].concat(list.map(r => cols.map(c => q(c[1](r))).join(","))).join("\n");
}

document.addEventListener("click", ev => {
  keepAwake();
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === "scrim") { if (ev.target === el) closeSheet(); return; }
  if (!["clearsample", "delgame", "rmplayer", "discard"].includes(act) && ui.confirm && !ui.sheet) { ui.confirm = null; }
  switch (act) {
    case "view": ui.view = v; ui.peekId = null; ui.confirm = null; render(); break;
    case "pitch": push({ t: "pitch", k: v }); break;
    case "pa":
      if (NEEDS_POS[v] && G.settings.askHits !== false) { ui.sheet = { type: "pos", r: v }; renderSheet(); }
      else if (HIT_CODES.includes(v) && G.settings.askHits !== false) { ui.bb = v === "HR" ? "FB" : null; ui.sheet = { type: "hit", r: v }; renderSheet(); }
      else push({ t: "pa", r: v });
      break;
    case "pos": push({ t: "pa", r: ui.sheet.r, p: +v }); break;
    case "bbtype": ui.bb = ui.bb === v ? null : v; renderSheet(); break;
    case "hitpos": { const e = { t: "pa", r: ui.sheet.r, p: +v }; if (ui.bb) e.bb = ui.bb; push(e); break; }
    case "hitskip": { const e = { t: "pa", r: ui.sheet.r }; if (ui.bb) e.bb = ui.bb; push(e); break; }
    case "base": { const b = +el.dataset.b; if (!ui.peekId && S.bases[b] && !S.final) { ui.sheet = { type: "runner", b }; renderSheet(); } break; }
    case "run": push({ t: "run", b: ui.sheet.b, a: v }); break;
    case "undo": { const g = curGame(); if (g && g.events.length) { g.events.pop(); save(); render(); } break; }
    case "tab": ui.bookTeam = +v; renderBook(); break;
    case "sound":
      ui.sound = !ui.sound; el.setAttribute("aria-pressed", ui.sound); el.textContent = ui.sound ? "Sound on" : "Sound off";
      if (ui.sound) { audio(); SFX.hit(); }
      break;
    case "sounds": ui.msg = ""; ui.sheet = { type: "sounds" }; renderSheet(); break;
    case "clip-play": {
      audio();
      if (nowPlaying && nowPlaying.slot === v) { stopClip(false); break; }
      if (clips[v]) playClip(v).then(ok => { if (!ok) { ui.msg = "That file couldn't be played. MP3, M4A and WAV files work best."; renderSheet(); } });
      else if (BUILT_IN[v]) SFX[BUILT_IN[v]]();
      break;
    }
    case "clip-choose": ui.audioSlot = v; audio(); $("audioFile").click(); break;
    case "clip-rm": if (nowPlaying && nowPlaying.slot === v) stopClip(false); delete clips[v]; saveClip(v); renderSheet(); break;
    case "walkup": audio(); cancelQueue(); if (nowPlaying && nowPlaying.slot === v) stopClip(true); else { stopClip(true); playClip(v); } break;
    case "music":
      audio(); cancelQueue();
      if (nowPlaying && nowPlaying.slot.startsWith("inning:")) stopClip(true); else { stopClip(true); runQueue([nextInningSong()]); }
      break;
    case "togglemode": {
      const g = curGame(); if (!g) break;
      g.settings.mode = modeOf(g) === "dugout" ? "scorekeeper" : "dugout";
      store.prefs = Object.assign({}, store.prefs, { mode: g.settings.mode });
      ui.bookTeam = null; save(); render(); break;
    }
    case "quick": push({ t: "quick", k: v }); break;
    case "toggleloc": {
      const g = curGame(); if (!g) break;
      g.settings.askHits = g.settings.askHits === false;
      store.prefs = Object.assign({}, store.prefs, { askHits: g.settings.askHits });
      save(); renderGamebar(); break;
    }
    case "inning-add": ui.audioSlot = "inning:" + Date.now().toString(36); audio(); $("audioFile").click(); break;
    case "close": if (ui.sheet && ui.sheet.type === "sounds") stopClip(true); closeSheet(); break;
    case "newgame": openNewGame(); break;
    case "startgame": startGame(); break;
    case "lineups": openLineups(); break;
    case "savelineups": saveLineups(); break;
    case "lu-add": readDraftRows(); ui.draft.rows.push({ pid: "", pos: "EH" }); renderSheet(); break;
    case "lu-bench": { readDraftRows(); const rows = ui.draft.rows; rows.push({ pid: v, pos: firstOpenPos(rows, rows.length, player(v)) }); renderSheet(); break; }
    case "inn": {
      readDraftRows();
      ui.draft.innings = Math.min(15, Math.max(3, ui.draft.innings + +v));
      if (ui.sheet && ui.sheet.type === "gamemenu") applyGameMenu(); else renderSheet();
      break;
    }
    case "lu-rm": readDraftRows(); ui.draft.rows.splice(+v, 1); renderSheet(); break;
    case "lu-up": case "lu-down": {
      readDraftRows(); const i = +v, j = act === "lu-up" ? i - 1 : i + 1, rows = ui.draft.rows;
      if (j >= 0 && j < rows.length) [rows[i], rows[j]] = [rows[j], rows[i]];
      renderSheet(); break;
    }
    case "gamemenu": openGameMenu(); break;
    case "savegamemenu": saveGameMenu(); break;
    case "endgame": endGame(); break;
    case "discard":
      if (ui.confirm !== "discard") { readDraftRows(); ui.confirm = "discard"; renderSheet(); break; }
      store.games = store.games.filter(g => g.id !== store.currentId); store.currentId = null;
      save(); closeSheet(); render(); break;
    case "resume": ui.view = "game"; ui.peekId = null; render(); break;
    case "peek": ui.peekId = v; ui.bookTeam = null; ui.view = "game"; render(); break;
    case "unpeek": ui.peekId = null; ui.view = "stats"; render(); break;
    case "reopen": {
      const g = store.games.find(x => x.id === ui.peekId);
      if (g && !store.currentId) { g.done = false; store.currentId = g.id; ui.peekId = null; save(); render(); }
      break;
    }
    case "delgame":
      if (ui.confirm !== "del:" + v) { ui.confirm = "del:" + v; render(); break; }
      store.games = store.games.filter(g => g.id !== v); if (store.currentId === v) store.currentId = null;
      ui.confirm = null; save(); render(); break;
    case "sort": ui.sort = ui.sort.k === v ? { k: v, d: -ui.sort.d } : { k: v, d: v === "name" ? 1 : -1 }; render(); break;
    case "table": ui.table = v; render(); break;
    case "addplayer": {
      store.team.players.push({ id: uid(), name: "", num: "", pos: "Bench", bats: "" });
      save(); render();
      const inputs = document.querySelectorAll('[data-ch="pname"]'); if (inputs.length) inputs[inputs.length - 1].focus();
      break;
    }
    case "rmplayer":
      if (ui.confirm !== "rm:" + v) { ui.confirm = "rm:" + v; render(); break; }
      store.team.players = store.team.players.filter(p => p.id !== v); ui.confirm = null; save(); render(); break;
    case "clearsample":
      if (ui.confirm !== "clear") { ui.confirm = "clear"; render(); break; }
      store = blankStore(); ui.confirm = null; ui.view = "roster"; ui.peekId = null; save(); render(); break;
    case "backup": ui.msg = ""; ui.sheet = { type: "backup" }; renderSheet(); break;
    case "dl-backup":
      ui.msg = download(`scorebook-backup-${today()}.json`, JSON.stringify(store), "application/json") ? "Backup downloaded. On iPad, look in the Files app under Downloads." : "This browser blocked the download.";
      renderSheet(); break;
    case "dl-csv":
      ui.msg = download(`${store.team.name.replace(/[^\w]+/g, "-")}-stats-${today()}.csv`, seasonCSV(), "text/csv") ? "Stats downloaded. They open in Numbers, Excel or Google Sheets." : "This browser blocked the download.";
      renderSheet(); break;
    case "copy-csv": {
      const text = seasonCSV();
      const done = ok => { ui.msg = ok ? "Copied. Paste into a spreadsheet." : "Copy was blocked. Use the download button instead."; renderSheet(); };
      try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch (e) { done(false); }
      break;
    }
    case "restore": $("restoreFile").click(); break;
  }
});

document.addEventListener("change", ev => {
  const el = ev.target, ch = el.dataset && el.dataset.ch; if (!ch) return;
  const p = el.dataset.id ? player(el.dataset.id) : null;
  if (ch === "minPA") { ui.minPA = +el.value; render(); }
  else if (ch === "incCur") { ui.incCur = el.checked; render(); }
  else if (ch === "lu") {
    const i = +el.dataset.i, before = ui.draft.rows[i] && ui.draft.rows[i].pid;
    readDraftRows();
    const r = ui.draft.rows[i];
    if (el.dataset.row === "pid" && r.pid !== before) r.pos = r.pid ? firstOpenPos(ui.draft.rows, i, player(r.pid)) : "EH";
    ui.msg = ""; renderSheet();
  }
  else if (ch === "draftMode") { if (ui.sheet && ui.sheet.type === "gamemenu") applyGameMenu(); else { readDraftRows(); renderSheet(); } }
  else if (ch === "setting") applyGameMenu();
  else if (ch === "autoWalkup" || ch === "bothTeams" || ch === "situational") { store.audio = Object.assign({}, store.audio, { [ch]: el.checked }); save(); }
  else if (ch === "clip-start" || ch === "clip-dur" || ch === "clip-vol") {
    const c = clips[el.dataset.slot]; if (!c) return;
    const n = Math.max(0, parseFloat(el.value) || 0);
    if (ch === "clip-start") c.start = n; else if (ch === "clip-dur") c.dur = n; else c.vol = Math.min(1.5, n);
    saveClip(el.dataset.slot);
  }
  else if (ch === "teamName") { store.team.name = el.value.trim() || "My Team"; save(); }
  else if (p) {
    if (ch === "pname") p.name = el.value.trim();
    if (ch === "pnum") p.num = el.value.trim();
    if (ch === "ppos") {
      const all = [p.pos || "", ...(p.alt || []), "", ""].slice(0, 3);
      all[+el.dataset.k] = el.value;
      const clean = all.filter((x, i, a) => x && a.indexOf(x) === i);
      p.pos = clean[0] || ""; p.alt = clean.slice(1);
      render();
    }
    if (ch === "pbats") p.bats = el.value;
    save();
  }
});

$("audioFile").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0], slot = ui.audioSlot; ev.target.value = "";
  if (!f || !slot) return;
  if (f.size > 25 * 1024 * 1024) { ui.msg = "That file is over 25 MB. Trim it or pick a smaller file."; renderSheet(); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const isWalkup = slot.startsWith("walkup:"), isSong = slot.startsWith("inning:");
    const c = { name: f.name, data: reader.result, start: 0, dur: isWalkup ? 15 : isSong ? 60 : 0, vol: 1 };
    try { await snippet(c); } catch (e) { ui.msg = "That file couldn't be played. MP3, M4A and WAV files work best."; renderSheet(); return; }
    if (!isWalkup && !isSong && c.buf.duration > 12) { c.dur = 8; c.buf = null; }   // long file for a game sound: start with an 8-second snippet
    clips[slot] = c; saveClip(slot); ui.msg = "";
    renderSheet(); playClip(slot);
  };
  reader.readAsArrayBuffer(f);
});

$("restoreFile").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !d.team || !Array.isArray(d.games)) throw new Error("bad");
      store = d; save(); ui.peekId = null;
      ui.msg = `Restored ${d.games.length} game${d.games.length === 1 ? "" : "s"} and ${d.team.players.length} players.`;
      render();
    } catch (e) { ui.msg = "That file isn't a Dugout Scorebook backup."; renderSheet(); }
    ev.target.value = "";
  };
  reader.readAsText(f);
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && ui.sheet) closeSheet();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches(".base")) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

store = load() || sampleStore();
loadClips();
if (store.currentId) ui.view = "game";
render();
})();
</script>
