<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ScoreKept</title>
<meta name="theme-color" content="#14284b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ScoreKept">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Tourney:ital,wght@1,800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: scoreboard band across the top; below it the live situation + input pad on the left, the scorebook grid on the right (stacked on phones). */
:root {
  --paper: #f4f7f9;
  --surface: #ffffff;
  --ink: #14212c;
  --muted: #586a7a;
  --rule: #c7d5e1;
  --rule-soft: #e2eaf1;
  --board: #123b2a;
  --board-ink: #eef4ec;
  --board-dim: #8fb3a0;
  --lamp: #ffc93c;
  --stitch: #c8102e;
  --stitch-soft: #fbe6e9;
  --safe: #17784a;
  --safe-soft: #e1f3e9;
  --ink-blue: #1d4f9a;
  --infield: #e9d3b4;
  --grass: #cfe5d2;
  --shadow: 0 1px 2px rgba(20, 33, 44, .08), 0 4px 14px rgba(20, 33, 44, .06);
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-label: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-varsity: "Tourney", "Arial Black", Impact, sans-serif;   /* sporty slanted lettering for the app name and team blocks (always 800 italic) */
  /* Team colors: applyTeamColors() overrides these from the palette picked on the Team tab */
  --sel-bg: var(--ink); --sel-ink: var(--paper);
  --team-brand: var(--ink); --team-shadow: var(--stitch); --team-brand-d: var(--ink); --team-shadow-d: var(--stitch);
  --brand-fill: var(--team-brand); --brand-shadow: var(--team-shadow);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1418; --surface: #161f26; --ink: #e5ecf1; --muted: #93a5b4;
    --rule: #2b3b48; --rule-soft: #1e2a33; --board: #0a2519; --board-ink: #eef4ec; --board-dim: #6f957f;
    --lamp: #ffd25c; --stitch: #ff5d70; --stitch-soft: #3a1a20; --safe: #4cc38a; --safe-soft: #12301f;
    --ink-blue: #7fb0ff; --infield: #5a4632; --grass: #1d3a27; --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1418; --surface: #161f26; --ink: #e5ecf1; --muted: #93a5b4;
  --rule: #2b3b48; --rule-soft: #1e2a33; --board: #0a2519; --board-ink: #eef4ec; --board-dim: #6f957f;
  --lamp: #ffd25c; --stitch: #ff5d70; --stitch-soft: #3a1a20; --safe: #4cc38a; --safe-soft: #12301f;
  --ink-blue: #7fb0ff; --infield: #5a4632; --grass: #1d3a27; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(86px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--ink-blue); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand, .teamword { font-family: var(--f-varsity); font-weight: 800; font-style: italic; letter-spacing: .02em; text-transform: uppercase; line-height: 1.1; color: var(--brand-fill); text-shadow: 2px 2px 0 var(--brand-shadow); }
.brand { font-size: clamp(24px, 8.6vw, 42px); white-space: nowrap; margin: 0; letter-spacing: .05em; text-shadow: .08em .08em 0 var(--brand-shadow); padding: 0 .1em .08em 0; }
.teamword { font-size: 20px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --brand-fill: var(--team-brand-d); --brand-shadow: var(--team-shadow-d); } }
:root[data-theme="dark"] { --brand-fill: var(--team-brand-d); --brand-shadow: var(--team-shadow-d); }
.chip { font-family: var(--f-label); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--rule-soft); color: var(--muted); }
.chip.live { background: var(--stitch); color: #fff; }
.chip.clock { font-variant-numeric: tabular-nums; background: var(--rule-soft); color: var(--ink); }
.chip.clock.warn { background: var(--lamp); color: #1b1400; }
.chip.clock.called { background: var(--stitch); color: #fff; }
.topbar .spacer { flex: 1; }
.tbtn { min-height: 40px; padding: 0 12px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:disabled { opacity: .4; cursor: default; }
.tbtn[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-ink); border-color: var(--sel-bg); }

/* Scoreboard */
.board { background: var(--team-board, var(--board)); color: var(--board-ink); border-radius: 10px; padding: 6px 10px 8px; overflow: hidden; }
.board table { border-collapse: collapse; width: 100%; table-layout: fixed; font-variant-numeric: tabular-nums; }
.board th { font-family: var(--f-label); font-weight: 600; font-size: 11px; letter-spacing: .08em; color: var(--board-dim); text-transform: uppercase; padding: 2px 2px 3px; text-align: center; }
.board th.team { width: 32%; }
@media (min-width: 700px) { .board th.team { width: 24%; } }
.board th.team, .board td.team { text-align: left; }
.board td { font-family: var(--f-display); font-weight: 700; font-size: clamp(15px, 2.4vw, 22px); line-height: 1.15; text-align: center; padding: 1px 2px; }
.board td.team { font-family: var(--f-display); font-size: clamp(13px, 1.9vw, 17px); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; padding-right: 8px; overflow: hidden; text-overflow: ellipsis; }
.board td.team .bat { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--team-lamp, var(--lamp)); margin-right: 6px; vertical-align: middle; visibility: hidden; }
.board tr.batting td.team .bat { visibility: visible; }
.board td.now { color: var(--team-lamp, var(--lamp)); }
.board td.tot { color: var(--team-lamp, var(--lamp)); border-left: 2px solid rgba(255,255,255,.12); }
.board th.tot { border-left: 2px solid rgba(255,255,255,.12); }
.board td.blank { color: var(--board-dim); opacity: .35; }
.board th.addinn { width: 30px; padding: 0; }
.board th.addinn button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--board-dim); background: transparent; color: var(--board-ink); font-size: 16px; line-height: 1; padding: 0; }

/* Main columns */
.main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .main { grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); align-items: start; } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; min-width: 0; }
.panel h2 { font-family: var(--f-label); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

/* Situation */
.situ { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; }
.diamond { width: 100%; max-width: 140px; aspect-ratio: 1; justify-self: center; }
.diamond .base { cursor: pointer; }
.diamond .base rect { fill: var(--surface); stroke: var(--muted); stroke-width: 2.5; }
.diamond .base.on rect { fill: var(--lamp); stroke: var(--ink); }
.diamond .rname { font-family: var(--f-label); font-weight: 600; font-size: 13px; fill: var(--ink); }
.diamond .hit { fill: transparent; }
.count { display: grid; gap: 10px; }
.count .row { display: grid; gap: 3px; }
.count .lbl { font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--muted); }
.count .dots { display: flex; gap: 6px; }
.count .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--rule); }
.count .b .dot.on { background: var(--safe); border-color: var(--safe); }
.count .s .dot.on { background: var(--lamp); border-color: #c79400; }
.count .o .dot.on { background: var(--stitch); border-color: var(--stitch); }

.atbat { display: grid; gap: 2px; padding: 10px 0 4px; border-top: 1px solid var(--rule-soft); margin-top: 8px; }
.atbat .now { font-family: var(--f-display); font-weight: 800; font-size: 25px; line-height: 1.05; text-wrap: balance; }
.atbat .now small { font-family: var(--f-label); font-weight: 600; font-size: 16px; color: var(--muted); margin-right: 6px; }
.atbat .meta { color: var(--muted); font-size: 14px; }

/* Input pad */
.pad { display: grid; gap: 10px; margin-top: 10px; }
.group { display: grid; gap: 5px; }
.group .gl { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.keys { display: grid; gap: 5px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.key { min-height: 48px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); display: grid; place-content: center; text-align: center; padding: 4px; line-height: 1.05; }
.key b { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .02em; }
.key span { font-family: var(--f-label); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
.key:active { transform: translateY(1px); }
.key:disabled { opacity: .35; cursor: default; }
.key.pitch { background: var(--rule-soft); }
.key.wide { grid-column: span 2; }
.key.on { background: var(--safe-soft); border-color: color-mix(in srgb, var(--safe) 35%, var(--rule)); }
.key.on b { color: var(--safe); }
.key.out { background: var(--stitch-soft); border-color: color-mix(in srgb, var(--stitch) 30%, var(--rule)); }
.key.out b { color: var(--stitch); }
.kc { display: inline-block; transform: scaleX(-1); }
.key .kc { font: inherit; color: inherit; letter-spacing: inherit; }

/* Scorebook */
.bookhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: transparent; min-height: 36px; font-size: 15px; padding: 0 14px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--sel-bg); color: var(--sel-ink); }
.bookscroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
table.book { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; }
table.book th, table.book td { border: 1px solid var(--rule-soft); }
table.book thead th { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--paper); padding: 6px 4px; position: sticky; top: 0; }
table.book th.inn.now { color: var(--ink-blue); }
table.book td.slot { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-align: center; width: 30px; color: var(--muted); }
table.book td.name { padding: 4px 10px 4px 8px; white-space: nowrap; font-weight: 600; min-width: 120px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
table.book tr.up td.name { color: var(--ink-blue); }
table.book tr.up td.slot { color: var(--ink-blue); }
table.book td.cell { width: 52px; min-width: 52px; height: 52px; padding: 2px; vertical-align: top; }
table.book td.cell .stack { display: flex; flex-direction: column; gap: 2px; }
table.book td.st { text-align: center; font-family: var(--f-label); font-weight: 600; font-size: 16px; width: 38px; }
table.book th.stat, table.book td.st.first { border-left: 2px solid var(--rule); }
table.book tfoot td { font-family: var(--f-label); font-weight: 700; font-size: 14px; text-align: center; background: var(--paper); padding: 4px; }
.mini { display: block; width: 46px; height: 46px; }
.mini .path { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.mini .ran { fill: none; stroke: var(--ink-blue); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.mini .scored { fill: var(--ink-blue); opacity: .22; }
.mini .code { font-family: var(--f-display); font-weight: 800; font-size: 15px; fill: var(--ink); }
.mini .outc { fill: none; stroke: var(--stitch); stroke-width: 1.6; }
.mini .outn { font-family: var(--f-label); font-weight: 700; font-size: 11px; fill: var(--stitch); }
.mini .note { font-family: var(--f-label); font-weight: 700; font-size: 9px; fill: var(--muted); }

.lower { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-top: 14px; }
.pbp { list-style: none; margin: 0; padding: 0; max-height: 480px; overflow-y: auto; display: grid; gap: 0; }
.pbp li { padding: 6px 0; border-bottom: 1px solid var(--rule-soft); font-size: 15px; display: grid; grid-template-columns: 48px 1fr; gap: 8px; }
.pbp li .inn { font-family: var(--f-label); font-weight: 700; color: var(--muted); font-size: 13px; padding-top: 2px; }
.pbp li .run { color: var(--safe); font-weight: 700; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; font-size: 14px; color: var(--muted); }
.legend b { font-family: var(--f-display); color: var(--ink); font-size: 16px; display: inline-block; min-width: 34px; }

/* Final banner */
.final { background: var(--lamp); color: #1b1400; border-radius: 8px; padding: 10px 14px; font-weight: 700; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.final b { font-family: var(--f-display); font-size: 24px; text-transform: uppercase; }

/* Sheets (overlays) */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 18, .5); z-index: 50; display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .scrim { place-items: center; } }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; width: 100%; max-width: 520px; max-height: calc(100% - 20px); overflow-y: auto; padding: 18px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.sheet h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 26px; text-transform: uppercase; }
.sheet p { margin: 0; color: var(--muted); }
.posgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.posgrid .key b { font-size: 22px; }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.field label { font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea, .field select { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); width: 100%; }
.field textarea { min-height: 200px; resize: vertical; line-height: 1.5; }
.two { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 520px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.check { display: flex; flex-direction: row-reverse; justify-content: space-between; gap: 16px; align-items: center; font-size: 15px; }
:root { --switch-on: #34c759; --switch-off: #d5dce3; --hit3: #7a4cc9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --switch-on: #30d158; --switch-off: #3a4651; --hit3: #b58cff; } }
:root[data-theme="dark"] { --switch-on: #30d158; --switch-off: #3a4651; --hit3: #b58cff; }
input.switch, .check input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 31px; background: var(--switch-off); position: relative; flex: none; margin: 0; cursor: pointer; transition: background .2s; }
input.switch::after, .check input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transition: transform .2s; }
input.switch:checked, .check input[type=checkbox]:checked { background: var(--switch-on); }
input.switch:checked::after, .check input[type=checkbox]:checked::after { transform: translateX(20px); }
.setlist { border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); overflow: hidden; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px; border-top: 1px solid var(--rule-soft); cursor: pointer; }
.setrow:first-child { border-top: 0; }
.setrow b { display: block; font-weight: 600; }
.setrow small { display: block; color: var(--muted); font-size: 13px; line-height: 1.35; margin-top: 2px; }
.setrow select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); flex: none; max-width: 50%; }
.setrow > span:first-child { flex: 1; min-width: 0; }
.help { display: grid; gap: 8px; }
.help details { border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); }
.help summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: 17px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.help summary::-webkit-details-marker { display: none; }
.help summary::after { content: "+"; font-size: 22px; color: var(--muted); font-weight: 400; }
.help details[open] summary::after { content: "−"; }
.help .hbody { padding: 0 14px 12px; font-size: 15px; line-height: 1.5; }
.help .hbody p { margin: 0 0 8px; color: var(--ink); }
.help .hbody ul { margin: 0 0 8px; padding-left: 20px; display: grid; gap: 6px; }
.help dl.hkeys { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; margin: 0 0 10px; }
.help dl.hkeys dt { font-family: var(--f-display); font-weight: 800; font-size: 17px; color: var(--ink-blue); }
.help dl.hkeys dd { margin: 0; }
.help .kcx { display: inline-block; transform: scaleX(-1); }
.setrow.col { flex-direction: column; align-items: stretch; gap: 8px; cursor: default; }
.rrgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 120px)); gap: 6px 12px; }
.rrgrid span { font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rrgrid input { font: inherit; width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }
.danger { background: var(--stitch); color: #fff; border-color: var(--stitch); }
.primary { background: var(--sel-bg); color: var(--sel-ink); border-color: var(--sel-bg); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Views: Game / Season / Roster */
.nav { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.nav button { border: 0; background: transparent; min-height: 40px; padding: 0 14px; font-size: 15px; font-weight: 600; }
.nav button[aria-selected="true"] { background: var(--sel-bg); color: var(--sel-ink); }
.view { display: grid; gap: 14px; }
.empty { text-align: center; padding: 40px 16px; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; text-transform: uppercase; color: var(--ink); letter-spacing: .02em; margin: 0; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.banner { background: var(--rule-soft); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.banner .spacer { flex: 1; }
.gamebar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.gamebar .spacer { flex: 1; }

/* Stats tables */
.sbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.sbar .spacer { flex: 1; }
.sbar label { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.sbar select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.tscroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
table.stats { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
table.stats th, table.stats td { padding: 8px 8px; text-align: right; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; }
table.stats th { font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
table.stats th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
table.stats th.sorted { color: var(--ink-blue); }

  padding: 6px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));

/* ---- Layouts by screen. detectLayout() sets html[data-layout] to one of:
   phone (upright phone), short (phone on its side, small landscape screens such as a
   Raspberry Pi touchscreen), tablet (upright tablet), wide (tablet on its side, computer). ---- */
.play { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.play .colL { display: contents; }               /* one column: score bug, batter, buttons, extras */
.play .bug { order: 0; } .play .atbatp { order: 1; } .play .padp { order: 2; } .play .extra { order: 3; }
.play .pad { margin-top: 0; }
.extra { display: none; }
.dueup { list-style: none; margin: 0 0 12px; padding: 0; display: grid; }
.dueup li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule-soft); font-size: 15px; }

.dueup .ln { font-family: var(--f-label); font-weight: 600; color: var(--muted); }
.extra .pbp { max-height: none; }
html[data-layout] .key b span.kc { font: inherit; color: inherit; letter-spacing: inherit; }   /* the backwards K stays full size */

html[data-layout="phone"] .play { gap: 8px; }
html[data-layout="phone"] .play .panel { padding: 10px; }
html[data-layout="phone"] .key { min-height: 44px; }

/* Tablets and computers: bigger targets and a bigger score bug */
html[data-layout="tablet"] .extra, html[data-layout="wide"] .extra { display: block; }
html[data-layout="tablet"] .key, html[data-layout="wide"] .key { min-height: 62px; }

/* Wide: two columns, situation on the left and buttons on the right */

html[data-layout="wide"] .play .colL { display: grid; gap: 12px; }

html[data-layout="short"] .banner .tbtn { min-height: 32px; }
html[data-layout="short"] .gamebar .matchup, html[data-layout="short"] .gamebar .chip:not(.clock) { display: none; }
html[data-layout="short"] .gamebar .tbtn { min-height: 34px; }

/* Side rail instead of the bottom tab bar when the screen is wide or short */
html[data-layout="wide"] .tabbar, html[data-layout="short"] .tabbar {
  left: calc(10px + env(safe-area-inset-left, 0px)); top: 50%; bottom: auto; transform: translateY(-50%);
  right: auto; flex-direction: column; justify-content: flex-start; width: 84px; padding: 6px; border-radius: 28px;
  border: 1px solid var(--rule); box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }

html[data-layout="wide"] body { padding-left: calc(112px + env(safe-area-inset-left, 0px)); padding-bottom: 24px; }
html[data-layout="short"] body { padding-left: calc(88px + env(safe-area-inset-left, 0px)); }

<script>
(function () {
"use strict";

/* =====================================================================
   Constants
   ===================================================================== */
const KEY = "dugout-scorebook.v2" + (/[?&]preview\b/.test(location.search) ? ".preview" : "");   // the screen preview page keeps its own data
const POS = [null, "P", "C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "LCF", "RCF", "SF"];   // scorebook numbers: 10 = left-center, 11 = right-center, 12 = short fielder
const POS_NAME = [null, "Pitcher", "Catcher", "First base", "Second base", "Third base", "Shortstop", "Left field", "Center field", "Right field", "Left-center field", "Right-center field", "Short field"];
const FIELD_POS = ["P", "C", "1B", "2B", "3B", "SS", "LF", "LCF", "CF", "RCF", "RF", "SF"];
const LINEUP_POS = [...FIELD_POS, "EH"];                       // EH = extra hitter: bats, doesn't field
const posList = pl => pl ? [pl.pos, ...(pl.alt || [])].filter((x, i, a) => x && LINEUP_POS.includes(x) && a.indexOf(x) === i) : [];
const NEEDS_POS = { GO: "Who fielded the grounder? Optional.", FO: "Who caught the fly ball? Optional.", LO: "Who caught the liner? Optional.", PO: "Who caught the pop-up? Optional.", SF: "Who caught the sacrifice fly? Optional.", E: "Who made the error? Optional: skip it if you're not sure." };
const HIT_CODES = ["1B", "2B", "3B", "HR"];
const BASES_FOR = { "1B": 1, "2B": 2, "3B": 3, HR: 4 };
const BB_OF = { GO: "GB", FO: "FB", LO: "LD", PO: "PU", SF: "FB", DP: "GB", FC: "GB", HRO: "FB" };   // batted-ball type implied by an out
const LEFT_SIDE = new Set([5, 6, 7, 10]), RIGHT_SIDE = new Set([3, 4, 9, 11]);                    // for pull / opposite field

const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* =====================================================================
   Storage
   store = { team: {name, players:[{id,name,num,pos,bats}]}, games: [...], currentId }
   game  = { id, date, opponent, ourSide (0 visitors / 1 home), settings, lineups:[[{pid,name,pos}],[...]], events:[], done }
   ===================================================================== */
function blankStore() { return ensureSeasons({ v: 2, sample: false, team: { name: "My Team", players: [] }, games: [], currentId: null }); }
const SEASON_TYPES = ["Spring", "Summer", "Fall"];
const seasonOf = d => { const m = +d.slice(5, 7); return (m <= 5 ? "Spring" : m <= 8 ? "Summer" : "Fall") + " " + d.slice(0, 4); };   // Jan–May, Jun–Aug, Sep–Dec
// Suggest the season after the current one (Spring → Summer → Fall → next Spring), or go by today's date.
function suggestSeasonName() {
  const cur = store && store.seasons && store.seasons.find(x => x.id === store.currentSeasonId);
  const m = cur && /^(Spring|Summer|Fall) (\d{4})$/.exec(cur.name);
  if (m) { const i = SEASON_TYPES.indexOf(m[1]); return i < 2 ? SEASON_TYPES[i + 1] + " " + m[2] : "Spring " + (+m[2] + 1); }
  return seasonOf(today());
}
// Every game belongs to a season. Older saves get one season holding all their games.
function ensureSeasons(st) {
  if (!Array.isArray(st.seasons) || !st.seasons.length) {
    const first = st.games.map(g => g.date).sort()[0] || today();
    st.seasons = [{ id: "s" + uid(), name: seasonOf(first), start: first }];
    st.currentSeasonId = st.seasons[0].id;
  }
  if (!st.seasons.some(x => x.id === st.currentSeasonId)) st.currentSeasonId = st.seasons[st.seasons.length - 1].id;
  st.games.forEach(g => { if (!g.seasonId) g.seasonId = st.currentSeasonId; });
  // Seasons from the first version were named "2026 Season"; rename them by when their games were played.
  st.seasons.forEach(x => { if (/^\d{4} Season$/.test(x.name)) { const d = st.games.filter(g => g.seasonId === x.id).map(g => g.date).sort()[0] || x.start; x.name = seasonOf(d); } });
  return st;
}
const viewSeason = () => ui.seasonView || store.currentSeasonId;
const inSeason = g => viewSeason() === "all" || g.seasonId === viewSeason();
// Data-safety state shown in the alert banner
const safety = { unreadable: false, saveFailed: false, blocked: false, protected: null };
function load() {
  let raw = null;

/* ---------- Your own sound clips ----------

const SIT_EVENTS = [["lead", "We take the lead", "lead"], ["tie", "We tie it up", "tie"], ["rally", "Rally: runner in scoring position, we're tied or behind", "rally"],

  const fx = cur.fx, our = g.ourSide, A = audioPrefs();

  const items = [];
  let main = null;
  // Offense: hits, walks and runs play when your team bats.
  if (weBat || A.bothTeams) {
    if (weBat && usA > themA && usB <= themB) main = sit("lead");
    else if (weBat && usA === themA && usB < themB) main = sit("tie");

  // Defense: strikeouts and outs play when your team is in the field.
  if (!main && (!weBat || A.bothTeams)) {

    if (!main) main = fx.k ? snd("fx:k") : fx.out ? snd("fx:out") : null;

function dots(n, on) { let h = ""; for (let i = 0; i < n; i++) h += `<span class="dot ${i < on ? "on" : ""}"></span>`; return h; }

function todayLine(t, slot) {
  const st = S.stats[t][keyOf(occ(S, t, slot), t, slot)];
  if (!st || !st.PA) return "First trip to the plate today";
  const bits = [`${st.H}-for-${st.AB}`];
  if (st.HR) bits.push(st.HR + " HR"); if (st.RBI) bits.push(st.RBI + " RBI"); if (st.BB) bits.push(st.BB + " BB"); if (st.K) bits.push(st.K + " K");
  return "Today: " + bits.join(", ");
}
function renderAtBat() {

  if (S.final) { $("atbat").innerHTML = `<div class="now">Game over</div><div class="meta">Tap “Save to season” above, or Undo to fix the last play.</div>`; return; }

}

function mini(c) {
  const pts = [[26, 48], [48, 26], [26, 4], [4, 26], [26, 48]];
  const ran = c.base > 0 ? `<polyline class="ran" points="${pts.slice(0, c.base + 1).map(p => p.join(",")).join(" ")}" />` : "";
  const code = c.looking ? `<text class="code" x="26" y="31" text-anchor="middle" transform="translate(52 0) scale(-1 1)">K</text>` : `<text class="code" x="26" y="31" text-anchor="middle">${esc(c.code)}</text>`;
  const out = c.out ? `<circle class="outc" cx="44" cy="44" r="7" /><text class="outn" x="44" y="48" text-anchor="middle">${c.out}</text>` : "";
  const notes = c.notes.length ? `<text class="note" x="2" y="9">${esc(c.notes.join(" "))}</text>` : "";
  return `<svg class="mini" viewBox="0 0 52 52" aria-label="${esc(c.code)}${c.scored ? ", scored" : ""}${c.out ? ", out " + c.out : ""}">
    <path class="path" d="M26 48 L48 26 L26 4 L4 26 Z" />${c.scored ? '<path class="scored" d="M26 48 L48 26 L26 4 L4 26 Z" />' : ""}${ran}${code}${out}${notes}</svg>`;
}
function renderBook() {

  $("tabs").innerHTML = (dug ? [G.ourSide] : [0, 1]).map(i => `<button role="tab" aria-selected="${i === t}" data-act="tab" data-v="${i}">${esc(names[i])}</button>`).join("");

  const tot = { AB: 0, R: 0, H: 0, RBI: 0, BB: 0, K: 0 };

    h += `<tr class="${slot === up ? "up" : ""}"><td class="slot">${slot + 1}</td><td class="name">${esc(entryName(who))}${who.pos ? ` <span style="color:var(--muted);font-weight:500">${esc(who.pos)}</span>` : ""}</td>`;

  ["AB", "R", "H", "RBI", "BB", "K"].forEach(k => h += `<td>${tot[k]}</td>`);

/* ---------- Season view ---------- */
function renderStats() {
  if (!TABLES[ui.table]) ui.table = "std";
  const { list, games, rec } = season();
  const tdef = TABLES[ui.table] || TABLES.std;
  const qualified = list.filter(r => r.PA >= ui.minPA && (ui.table !== "fld" || r.PL + r.E > 0 || r.POS));
  const sk = ui.sort.k, dir = ui.sort.d;
  qualified.sort((a, b) => {
    if (sk === "name") return dir * a.name.localeCompare(b.name);
    const va = a[sk], vb = b[sk];
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return typeof va === "string" ? dir * va.localeCompare(vb) : dir * (va - vb);
  });
  const best = {};
  tdef.cols.forEach(([k, f, better]) => {
    if (!better || qualified.length < 2) return;
    const vals = qualified.map(r => r[k]).filter(v => v != null);
    if (vals.length) best[k] = better > 0 ? Math.max(...vals) : Math.min(...vals);
  });
  const teamTot = withRates(list.reduce((a, r) => { for (const k in blankStat()) a[k] += r[k]; a.PL += r.PL; a.E += r.E; return a; }, Object.assign({ PL: 0, E: 0, pos: {} }, blankStat())));
  teamTot.G = games;

  const th = (k, label) => `<th class="${sk === k ? "sorted" : ""}"><button data-act="sort" data-v="${k}">${label}${sk === k ? (dir < 0 ? " ▼" : " ▲") : ""}</button></th>`;
  let h = `<thead><tr>${th("name", "Player")}${tdef.cols.map(([k, , , label]) => th(k, label || k)).join("")}</tr></thead><tbody>`;
  h += qualified.map(r => `<tr><td><span style="color:var(--muted);font-family:var(--f-label);font-weight:600;margin-right:6px">${esc(r.num)}</span>${esc(r.name)}</td>` +
    tdef.cols.map(([k, f]) => `<td class="${best[k] != null && r[k] === best[k] ? "best" : ""}">${fmt[f](r[k])}</td>`).join("") + "</tr>").join("");
  if (!qualified.length) h += `<tr><td colspan="${tdef.cols.length + 1}" style="text-align:left;color:var(--muted)">No stats yet. Finish a game and choose “Save to season”, and the numbers appear here.</td></tr>`;
  h += `</tbody><tfoot><tr><td>Team</td>${tdef.cols.map(([k, f]) => `<td>${k === "POS" ? "" : fmt[f](teamTot[k])}</td>`).join("")}</tr></tfoot>`;

  const cur = curGame();
  const minQual = games * 2;
  const leaderCats = [["AVG", "avg"], ["OPS", "avg"], ["wOBA", "avg"], ["HR", "int"], ["RBI", "int"], ["R", "int"]];
  const leaders = leaderCats.map(([k, f]) => {
    const pool = list.filter(r => r[k] != null && (f === "int" || r.PA >= minQual)).sort((a, b) => b[k] - a[k]);
    const top = pool[0];
    return `<li><span class="res" style="width:auto;min-width:56px;font-size:16px">${k}</span><span class="who">${top && top[k] > 0 ? esc(top.name) : "—"}</span><b>${top && top[k] > 0 ? fmt[f](top[k]) : ""}</b></li>`;
  }).join("");

  const gameItems = store.games.filter(g => inSeason(g) || g.id === store.currentId).sort((a, b) => b.date.localeCompare(a.date)).map(g => {
    const s = derive(g), us = total(s, g.ourSide), them = total(s, 1 - g.ourSide);
    const live = g.id === store.currentId;
    const res = live ? "" : us > them ? "W" : us < them ? "L" : "T";
    const confirmDel = ui.confirm === "del:" + g.id;
    return `<li><span class="res ${res.toLowerCase()}">${live ? "●" : res}</span>
      <span class="who">${g.ourSide ? "vs" : "at"} ${esc(g.opponent)} <b>${us}–${them}</b><small>${esc(g.date)}${live ? " · in progress" : ""}</small></span>
      ${live ? `<button class="tbtn" data-act="resume">Resume</button>` : `<button class="tbtn" data-act="peek" data-v="${g.id}">View</button>`}
      <button class="tbtn ${confirmDel ? "danger" : ""}" data-act="delgame" data-v="${g.id}">${confirmDel ? "Confirm delete" : "Delete"}</button></li>`;
  }).join("");

  const seg = ui.statsTab || "overview";
  const incSwitch = cur ? `<label><input type="checkbox" class="switch" id="incCur" data-ch="incCur" ${ui.incCur ? "checked" : ""}> Include today's game in progress</label>` : "";
  let body;
  if (seg === "overview") body = `
    <div class="lower3">
      <section class="panel"><h2>Games</h2>${gameItems ? `<ul class="games">${gameItems}</ul>` : `<p style="color:var(--muted);margin:0">No games yet.</p>`}
        ${cur ? "" : `<div style="margin-top:12px"><button class="tbtn primary" data-act="newgame" ${store.team.players.length ? "" : "disabled"}>New Game</button></div>`}</section>
      <section class="panel"><h2>Team leaders</h2><ul class="games">${leaders}</ul>
        <p style="color:var(--muted);font-size:13px;margin:8px 0 0">Rate stats need ${minQual} plate appearances (2 per team game) to qualify.</p>
        <div style="margin-top:12px"><button class="tbtn" data-act="backup">Export &amp; backup</button></div></section>
    </div>`;
  else if (seg === "batting") body = `
    <section class="panel">
      <div class="sbar">
        <div class="tabs" role="tablist">${Object.entries(TABLES).map(([k, t]) => `<button role="tab" aria-selected="${ui.table === k}" data-act="table" data-v="${k}">${t.label}</button>`).join("")}</div>
        <span class="spacer"></span>
        <label for="minPA">Min. PA <select id="minPA" data-ch="minPA">${[0, 5, 10, 20, 40].map(n => `<option ${n === ui.minPA ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        ${incSwitch}
      </div>
      <div class="tscroll"><table class="stats">${h}</table></div>
      <div class="gloss">${GLOSS[ui.table].map(([k, v]) => `<div><b>${k}</b>${v}</div>`).join("")}</div>
    </section>`;
  else body = `<section class="panel">${incSwitch ? `<div class="sbar">${incSwitch}</div>` : ""}${seg === "spray" ? sprayCharts() : lineupHistory()}</section>`;
  $("view").innerHTML = `
    <section class="panel">
      <div class="sbar" style="margin:0">
        <h2 style="margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="teamword">${esc(store.team.name)}</span>
          <select class="seasonsel" id="seasonSel" data-ch="seasonSel" aria-label="Season">${store.seasons.map(x => `<option value="${x.id}" ${x.id === viewSeason() ? "selected" : ""}>${esc(x.name)}${x.id === store.currentSeasonId ? " (current)" : ""}</option>`).join("")}<option value="all" ${viewSeason() === "all" ? "selected" : ""}>All seasons</option></select>
          <span>${games} game${games === 1 ? "" : "s"} · ${rec.T ? `${rec.W}–${rec.L}–${rec.T} (W–L–T)` : `${rec.W}–${rec.L}`}</span></h2>
        <span class="spacer"></span>
        <button class="tbtn" data-act="newseason">New Season</button>
      </div>
      <div class="tabs seg" role="tablist">${[["overview", "Overview"], ["batting", "Batting"], ["spray", "Spray charts"], ["lineups", "Lineups"]].map(([k, l]) => `<button role="tab" aria-selected="${seg === k}" data-act="statstab" data-v="${k}">${l}</button>`).join("")}</div>
    </section>
    ${body}`;
}

/* ---------- Spray charts: where each player's balls in play went ---------- */
// Each ball is drawn near the fielder you tapped, fanned out so dots don't stack. Home runs go past the fence.
const ZONE = { 1: [100, 128], 2: [100, 152], 3: [133, 116], 4: [118, 98], 5: [67, 116], 6: [82, 98], 7: [48, 76], 8: [100, 60], 9: [152, 76], 10: [73, 64], 11: [127, 64], 12: [100, 84] };
const HOME = [100, 162];
function sprayField(balls) {
  const n = {}, sz = balls.length > 60 ? .65 : 1;   // a season of team dots: smaller and tighter so they don't pile up
  const marks = balls.map(b => {
    const k = b.p + (b.r === "HR" ? "hr" : ""), i = n[k] = (n[k] || 0) + 1;
    let [x, y] = ZONE[b.p] || ZONE[8];
    if (b.r === "HR") { const dx = x - HOME[0], dy = y - HOME[1], len = Math.hypot(dx, dy); x = HOME[0] + dx / len * 148; y = HOME[1] + dy / len * 148; }
    if (i > 1) { const a = i * 2.4, rad = (2.5 + 3 * Math.sqrt(i)) * sz; x += Math.cos(a) * rad; y += Math.sin(a) * rad; }
    const tip = `<title>${b.r === "E" ? "Error" : b.r} to ${POS[b.p]} · ${esc(b.date)} vs ${esc(b.opp)}</title>`;
    x = x.toFixed(1); y = y.toFixed(1);
    if (b.r === "E") { const e = (3 * sz).toFixed(1); return `<g class="e">${tip}<path d="M${x - e} ${y - e} l${2 * e} ${2 * e} M${x - e} ${+y + +e} l${2 * e} -${2 * e}" /></g>`; }
    const cls = { "1B": "h1", "2B": "h2", "3B": "h3", HR: "hr" }[b.r] || "o";
    return `<circle class="${cls}" cx="${x}" cy="${y}" r="${((cls === "o" ? 3.2 : 4.2) * sz).toFixed(1)}">${tip}</circle>`;
  }).join("");
  return `<svg class="spray" viewBox="0 8 200 164" role="img" aria-label="Spray chart, ${balls.length} balls in play">
    <path class="grass" d="M100 166 L11 77 A126 126 0 0 1 189 77 Z" />
    <path class="dirt" d="M100 168 L146 122 Q100 66 54 122 Z" />
    <path class="line" d="M100 162 L11 73 M100 162 L189 73" />

    const T = teams[k] || (teams[k] = { key: k, name, games: [], balls: [] });
    const s = derive(g);
    T.games.push({ g, us: total(s, g.ourSide), them: total(s, 1 - g.ourSide), live: g.id === store.currentId });
    s.bip.forEach(b => { if (b.team !== g.ourSide) T.balls.push(Object.assign({ date: g.date, opp: name }, b)); });

      const m = map[e.pid];

      else map[e.pid] = { slot: e.slot + 1, pos: [e.pos], sub: true };

    return Object.assign(r, { name: pl ? pl.name : "Former player", num: pl ? pl.num : "", avg: r.slots.length ? r.slots.reduce((a, b) => a + b, 0) / r.slots.length : 99 });
  }).sort((a, b) => a.avg - b.avg);

  let h = `<thead><tr><th>Player</th><th>Starts</th>${games.map(g => `<th><button data-act="${g.id === store.currentId ? "resume" : "peek"}" data-v="${g.id}" title="${esc(g.opponent)}">${md(g.date)}<br><span style="font-weight:500;text-transform:none">${esc(g.opponent.split(" ")[0])}</span></button></th>`).join("")}</tr></thead><tbody>`;
  h += list.map(r => `<tr><td><span style="color:var(--muted);font-family:var(--f-label);font-weight:600;margin-right:6px">${esc(r.num)}</span>${esc(r.name)}</td><td>${r.starts}</td>${games.map(g => {

  }).join("")}</tr>`).join("");

    <p class="gloss" style="display:block">Each cell is batting spot · position. An arrow marks a position change during the game, and “(sub)” means the player came off the bench. A dash means they didn't play. Tap a date to open that game.</p>`;
}

// Drag a batter by the ☰ handle. The row follows your finger and the others slide out of the way.
let drag = null;
document.addEventListener("pointerdown", ev => {
  const grip = ev.target.closest && ev.target.closest("[data-grip]"); if (!grip || ev.button > 0) return;
  ev.preventDefault();
  readDraftRows();
  const row = grip.closest(".lurow"), list = row.parentElement, rows = [...list.children], from = rows.indexOf(row);
  const step = rows.length > 1 ? rows[1].getBoundingClientRect().top - rows[0].getBoundingClientRect().top : row.offsetHeight + 6;
  const scroller = row.closest(".sheet");
  drag = { row, rows, from, to: from, step, y0: ev.clientY, s0: scroller ? scroller.scrollTop : 0, scroller, id: ev.pointerId, moved: false };
  try { grip.setPointerCapture(ev.pointerId); } catch (e) {}
  row.classList.add("dragging");
});
document.addEventListener("pointermove", ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  ev.preventDefault();
  const sc = drag.scroller;
  if (sc) {   // near the top or bottom of the panel: scroll it
    const b = sc.getBoundingClientRect();
    if (ev.clientY < b.top + 50) sc.scrollTop -= 10; else if (ev.clientY > b.bottom - 50) sc.scrollTop += 10;
  }
  const dy = ev.clientY - drag.y0 + (sc ? sc.scrollTop - drag.s0 : 0);
  if (Math.abs(dy) > 4) drag.moved = true;
  drag.row.style.transform = `translateY(${dy}px)`;
  const to = Math.max(0, Math.min(drag.rows.length - 1, drag.from + Math.round(dy / drag.step)));
  drag.to = to;
  drag.rows.forEach((r, j) => {
    if (r === drag.row) return;
    const shift = drag.from < j && j <= to ? -drag.step : to <= j && j < drag.from ? drag.step : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
});
function endDrag(ev) {
  if (!drag || (ev && ev.pointerId !== drag.id)) return;
  const { from, to, moved } = drag; drag = null;
  if (moved && to !== from) { const rows = ui.draft.rows, [r] = rows.splice(from, 1); rows.splice(to, 0, r); }
  renderSheet();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
// The handle also moves a batter with the arrow keys
document.addEventListener("keydown", ev => {
  const grip = ev.target.closest && ev.target.closest("[data-grip]"); if (!grip || !/^Arrow(Up|Down)$/.test(ev.key)) return;
  ev.preventDefault(); readDraftRows();
  const rows = ui.draft.rows, i = +grip.dataset.grip, j = ev.key === "ArrowUp" ? i - 1 : i + 1;
  if (j < 0 || j >= rows.length) return;
  [rows[i], rows[j]] = [rows[j], rows[i]];
  renderSheet();
  const g = document.querySelector(`[data-grip="${j}"]`); if (g) g.focus();
});

function lineupError(rows) {
  const seen = {};
  for (const r of rows) {
    if (!r.pid || r.pos === "EH") continue;
    if (seen[r.pos]) return `${esc(player(seen[r.pos]).name)} and ${esc(player(r.pid).name)} are both at ${r.pos}. Each position can only be used once.`;
    seen[r.pos] = r.pid;

}
function readDraftRows() {

  ["opponent", "date", "opp"].forEach(k => { if ($("d-" + k)) d[k] = $("d-" + k).value; });
  if ($("d-oppAbbr")) d.oppAbbr = $("d-oppAbbr").value.trim().toUpperCase().slice(0, 5);
  if ($("d-side")) d.ourSide = +$("d-side").value;
  if ($("d-inn")) d.innings = +$("d-inn").value;
  if ($("d-dugout")) d.mode = $("d-dugout").checked ? "dugout" : "scorekeeper";

/* ---------- League rule controls: New Game, Game Settings, defaults and the welcome setup ---------- */
const EXTRA_OPTS = [[0, "None"], [1, "1 inning"], [2, "2 innings"], [3, "3 innings"], [-1, "Until decided"]];

function hrHelp(k) {

  if (!m) return "Every home run counts.";
  if (m[1] === "plus") return `A team can hit ${m[2]} more home run${m[2] === "1" ? "" : "s"} than the other team. Past that, a homer is an out.`;
  return +m[2] ? `Each team gets ${m[2]} home run${m[2] === "1" ? "" : "s"} a game. After that, a homer is an out.` : "Over the fence is an out.";

function rulesRows(r, prefix, ch) {

// Save a file: on iPhone/iPad this opens the share sheet (Save to Files, iCloud Drive, Mail, AirDrop);
// elsewhere it downloads. Resolves "shared", "downloaded", "cancelled" or "failed".
async function saveFile(name, text, type) {
  try {
    const file = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Macintosh|Android/.test(navigator.userAgent) && "ontouchend" in document) {
      await navigator.share({ files: [file], title: name });
      return "shared";
    }
  } catch (e) { if (e && e.name === "AbortError") return "cancelled"; }
  return download(name, text, type) ? "downloaded" : "failed";
}
function download(name, text, type) {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}
function seasonCSV() {
  const { list } = season();
  const cols = [["Player", r => r.name], ["Num", r => r.num]];
  const seen = new Set();
  Object.values(TABLES).forEach(t => t.cols.forEach(([k, f, , label]) => { if (!seen.has(k)) { seen.add(k); cols.push([label || k, r => f === "txt" ? (r[k] || "") : fmt[f](r[k]).replace("—", "")]); } }));

document.addEventListener("click", ev => {

      const t = ui.sheet && ui.sheet.type;
      if (t === "sounds") stopClip(true);
      if ((t === "sounds" || t === "teamedit" || t === "help") && ui.returnTo && (ui.returnTo === "settings" || ui.draft)) { ui.sheet = { type: ui.returnTo }; ui.returnTo = null; render(); break; }
      closeSheet(); break;
    }
    case "newgame": openNewGame(); break;
    case "startgame": startGame(); break;
    case "lineups": openLineups(); break;
    case "savelineups": saveLineups(); break;
    case "lu-add": readDraftRows(); ui.draft.rows.push({ pid: "", pos: "EH" }); renderSheet(); break;
    case "lu-bench": { readDraftRows(); const rows = ui.draft.rows; rows.push({ pid: v, pos: firstOpenPos(rows, rows.length, player(v)) }); renderSheet(); break; }
    case "inn": {
      readDraftRows();
      ui.draft.innings = Math.min(15, Math.max(3, ui.draft.innings + +v));
      if (ui.sheet && ui.sheet.type === "gamemenu") applyGameMenu(); else renderSheet();
      break;
    }
    case "lu-rm": readDraftRows(); ui.draft.rows.splice(+v, 1); renderSheet(); break;
    case "lu-pick": {
      readDraftRows(); const rows = ui.draft.rows, i = rows.findIndex(r => r.pid === v);
      if (i >= 0) rows.splice(i, 1); else rows.push({ pid: v, pos: firstOpenPos(rows, rows.length, player(v)) });
      ui.msg = ""; renderSheet(); break;
    }
    case "lu-last": { const rows = lastLineup(); if (rows) ui.draft.rows = rows; ui.msg = ""; renderSheet(); break; }
    case "lu-clear": ui.draft.rows = []; renderSheet(); break;
    case "ng-next": {
      readDraftRows(); const clash = lineupError(ui.draft.rows);
      if (clash) { ui.msg = clash; renderSheet(); break; }
      ui.msg = ""; ui.sheet.step = "game"; renderSheet(); break;
    }
    case "ng-back": readDraftRows(); ui.msg = ""; ui.sheet.step = "lineup"; renderSheet(); break;
    case "gamemenu": openGameMenu(); break;
    case "savegamemenu": saveGameMenu(); break;
    case "endgame": endGame(); break;
    case "discard":
      if (ui.confirm !== "discard") { readDraftRows(); ui.confirm = "discard"; renderSheet(); break; }
      store.games = store.games.filter(g => g.id !== store.currentId); store.currentId = null;
      save(); closeSheet(); render(); break;
    case "resume": ui.view = "game"; ui.peekId = null; render(); break;
    case "peek": ui.peekId = v; ui.bookTeam = null; ui.view = "book"; render(); break;
    case "unpeek": ui.peekId = null; ui.view = "stats"; render(); break;
    case "reopen": {
      const g = store.games.find(x => x.id === ui.peekId);
      if (g && !store.currentId) { g.done = false; store.currentId = g.id; ui.peekId = null; save(); render(); }
      break;
    }
    case "delgame":
      if (ui.confirm !== "del:" + v) { ui.confirm = "del:" + v; render(); break; }
      store.games = store.games.filter(g => g.id !== v); if (store.currentId === v) store.currentId = null;
      ui.confirm = null; save(); render(); break;
    case "sort": ui.sort = ui.sort.k === v ? { k: v, d: -ui.sort.d } : { k: v, d: v === "name" ? 1 : -1 }; render(); break;
    case "table": ui.table = v; render(); break;
    case "statstab": ui.statsTab = v; render(); break;
    case "sprayfilter": ui.sprayFilter = v; render(); break;
    case "teamcolor": store.team.colors = Object.assign(teamColors(), { [el.dataset.k]: v }); save(); render(); break;
    case "scoutteam": ui.scoutTeam = v; render(); break;
    case "settings":
      if (curGame()) { G = curGame(); S = derive(G); openGameMenu(); }
      else { ui.msg = ""; ui.returnTo = null; ui.sheet = { type: "settings" }; render(); }
      break;
    case "opensettings": ui.msg = ""; ui.returnTo = null; ui.draft = null; ui.sheet = { type: "settings" }; render(); break;
    case "teamedit": ui.returnTo = ui.sheet && ui.sheet.type === "settings" ? "settings" : null; ui.sheet = { type: "teamedit" }; render(); break;
    case "editplayer": ui.confirm = null; ui.sheet = { type: "player", id: v }; render(); break;
    case "addplayer": {
      const np = { id: uid(), name: "", num: "", pos: "", alt: [], bats: "" };
      store.team.players.push(np); save();
      ui.sheet = { type: "player", id: np.id }; render();
      const f = $("pl-name"); if (f) f.focus();
      break;
    }
    case "pbats": { const pl = player(el.dataset.id); if (pl) { pl.bats = pl.bats === v ? "" : v; save(); render(); } break; }
    case "rmplayer":
      if (ui.confirm !== "rm:" + v) { ui.confirm = "rm:" + v; render(); break; }
      store.team.players = store.team.players.filter(p => p.id !== v); ui.confirm = null;
      if (ui.sheet && ui.sheet.type === "player") ui.sheet = null;
      save(); render(); break;
    case "clearsample":
      if (ui.confirm !== "clear") { ui.confirm = "clear"; render(); break; }
      store = blankStore(); ui.seasonView = null; ui.confirm = null; ui.view = "roster"; ui.peekId = null; save();
      startOnboarding("team"); break;
    case "prefinn": {
      store.prefs = Object.assign({}, store.prefs);
      store.prefs.innings = Math.min(15, Math.max(3, prefRules().innings + +v));
      save(); render(); break;
    }
    case "onb-start": startOnboarding("team"); break;
    case "onb-sample":
      store = ensureSeasons(sampleStore()); store.onboarded = true; ui.sheet = null; ui.view = "game"; save(); render(); break;
    case "onb-again": startOnboarding("team"); break;
    case "onb-next": {
      const i = ONB_STEPS.indexOf(ui.sheet.step);
      if (ui.sheet.step === "team" && (!store.team.name.trim() || store.team.name === "My Team") && !($("onbName") && $("onbName").value.trim())) { ui.msg = "Enter your team's name to keep going."; render(); break; }
      ui.msg = ""; ui.sheet = { type: "onboard", step: ONB_STEPS[Math.min(i + 1, ONB_STEPS.length - 1)] }; render(); break;
    }
    case "onb-back": {
      const i = ONB_STEPS.indexOf(ui.sheet.step);
      ui.msg = ""; ui.sheet = { type: "onboard", step: i <= 0 ? (store.onboarded ? "team" : "welcome") : ONB_STEPS[i - 1] }; render(); break;
    }
    case "onb-mode": store.prefs = Object.assign({}, store.prefs, { mode: v }); save(); render(); break;
    case "onb-addp": onbAddPlayer(); break;
    case "onb-rmp": store.team.players = store.team.players.filter(p => p.id !== v); save(); render(); break;
    case "onb-finish": finishOnboarding(v); break;
    case "backup": ui.msg = ""; ui.sheet = { type: "backup" }; renderSheet(); break;
    case "dl-backup":
      readDraftRows();
      saveFile(`scorekept-backup-${today()}.json`, JSON.stringify(store), "application/json").then(r => {
        if (r === "shared" || r === "downloaded") { store.lastBackup = Date.now(); save(); }
        ui.msg = r === "shared" ? "Backup saved. Keep it somewhere off this device, like iCloud Drive or email, to be safe."
          : r === "downloaded" ? "Backup downloaded. On iPhone or iPad it's in the Files app under Downloads."
          : r === "cancelled" ? "Backup not saved." : "This browser blocked saving the file.";
        render();
      });
      break;
    case "dl-csv":
      ui.msg = download(`${store.team.name.replace(/[^\w]+/g, "-")}-stats-${today()}.csv`, seasonCSV(), "text/csv") ? "Stats downloaded. They open in Numbers, Excel or Google Sheets." : "This browser blocked the download.";
      renderSheet(); break;
    case "copy-csv": {
      const text = seasonCSV();
      const done = ok => { ui.msg = ok ? "Copied. Paste into a spreadsheet." : "Copy was blocked. Use the download button instead."; renderSheet(); };
      try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch (e) { done(false); }
      break;
    }
    case "restore": $("restoreFile").click(); break;
  }
});

document.addEventListener("input", ev => {
  const k = ev.target && ev.target.dataset && ev.target.dataset.onb; if (!k) return;
  if (k === "name") store.team.name = ev.target.value.trim() || "My Team";
  if (k === "abbr") store.team.abbr = ev.target.value.trim().toUpperCase().slice(0, 5);
  save();
  const pv = $("onbPreview"); if (pv) pv.innerHTML = bugPreview();
  const ab = $("onbAbbr"); if (ab && k === "name") ab.placeholder = abbrOf(store.team.name);
});
document.addEventListener("toggle", ev => { if (ev.target.matches && ev.target.matches(".help details") && ev.target.open) ui.helpOpen = ev.target.querySelector("summary").textContent; }, true);
const typedField = el => el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && !/^(checkbox|radio|range|file)$/.test(el.type));
document.addEventListener("change", ev => {
  const el = ev.target, ch = el.dataset && el.dataset.ch; if (!ch) return;
  const p = el.dataset.id ? player(el.dataset.id) : null;
  if (ch === "minPA") { ui.minPA = +el.value; render(); }
  else if (ch === "seasonSel") { ui.seasonView = el.value === store.currentSeasonId ? null : el.value; render(); }
  else if (ch === "draft") {
    readDraftRows();
    // Typing: refresh just the checklist, so the button you tap next isn't redrawn under your finger
    if (typedField(el)) { const ck = document.querySelector(".sheet .checklist"); if (ck && ui.draft.rows) ck.outerHTML = pregameChecklist(ui.draft); }
    else renderSheet();
  }
  else if (ch === "pref") {
    store.prefs = Object.assign({}, store.prefs);
    if (el.dataset.k === "dugout") store.prefs.mode = el.checked ? "dugout" : "scorekeeper"; else store.prefs[el.dataset.k] = el.checked;
    save();
  }
  else if (ch === "rr") {   // run rule boxes save without redrawing, so the next box keeps focus
    const mode = el.dataset.mode;
    if (mode === "prefrule") store.prefs = Object.assign({}, store.prefs, readRules("p-"));
    else { readDraftRows(); const g = mode === "setting" && curGame(); if (g) Object.assign(g.settings, ruleSettings(ui.draft)); }
    save();
  }
  else if (ch === "prefrule") { store.prefs = Object.assign({}, store.prefs, readRules("p-")); save(); render(); }
  else if (ch === "incCur") { ui.incCur = el.checked; render(); }
  else if (ch === "lu") {
    const i = +el.dataset.i, before = ui.draft.rows[i] && ui.draft.rows[i].pid;
    readDraftRows();
    const r = ui.draft.rows[i];
    if (el.dataset.row === "pid" && r.pid !== before) r.pos = r.pid ? firstOpenPos(ui.draft.rows, i, player(r.pid)) : "EH";
    ui.msg = ""; renderSheet();
  }
  else if (ch === "draftMode") { if (ui.sheet && ui.sheet.type === "gamemenu") applyGameMenu(); else { readDraftRows(); renderSheet(); } }
  else if (ch === "setting") { ui.keepSheet = typedField(el); applyGameMenu(); ui.keepSheet = false; }
  else if (ch === "clockstart") {
    const g = curGame(), m = /^(\d\d):(\d\d)$/.exec(el.value); if (!g || !m) return;
    const d = new Date(); d.setHours(+m[1], +m[2], 0, 0);
    g.clock = { start: d.getTime() }; g.timeUp = null; save(); render();
  }
  else if (ch === "autoWalkup" || ch === "bothTeams" || ch === "situational") { store.audio = Object.assign({}, store.audio, { [ch]: el.checked }); save(); }
  else if (ch === "clip-start" || ch === "clip-dur" || ch === "clip-vol") {
    const c = clips[el.dataset.slot]; if (!c) return;
    const n = Math.max(0, parseFloat(el.value) || 0);
    if (ch === "clip-start") c.start = n; else if (ch === "clip-dur") c.dur = n; else c.vol = Math.min(1.5, n);
    saveClip(el.dataset.slot);
  }
  else if (ch === "teamAbbr") { store.team.abbr = el.value.trim().toUpperCase().slice(0, 5); save(); }
  else if (ch === "teamName") { store.team.name = el.value.trim() || "My Team"; save(); }
  else if (p) {
    if (ch === "pname") p.name = el.value.trim();
    if (ch === "pnum") p.num = el.value.trim();
    if (ch === "ppos") {
      const all = [p.pos || "", ...(p.alt || []), "", ""].slice(0, 3);
      all[+el.dataset.k] = el.value;
      const clean = all.filter((x, i, a) => x && a.indexOf(x) === i);
      p.pos = clean[0] || ""; p.alt = clean.slice(1);
      render();
    }
    if (ch === "pbats") p.bats = el.value;
    save();
  }
});

$("audioFile").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0], slot = ui.audioSlot; ev.target.value = "";
  if (!f || !slot) return;
  if (f.size > 25 * 1024 * 1024) { ui.msg = "That file is over 25 MB. Trim it or pick a smaller file."; renderSheet(); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const isWalkup = slot.startsWith("walkup:"), isSong = slot.startsWith("inning:");
    const c = { name: f.name, data: reader.result, start: 0, dur: isWalkup ? 15 : isSong ? 60 : 0, vol: 1 };
    try { await snippet(c); } catch (e) { ui.msg = "That file couldn't be played. MP3, M4A and WAV files work best."; renderSheet(); return; }
    if (!isWalkup && !isSong && c.buf.duration > 12) { c.dur = 8; c.buf = null; }   // long file for a game sound: start with an 8-second snippet
    clips[slot] = c; saveClip(slot); ui.msg = "";
    renderSheet(); playClip(slot);
  };
  reader.readAsArrayBuffer(f);
});

$("restoreFile").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !d.team || !Array.isArray(d.games)) throw new Error("bad");
      store = ensureSeasons(d); ui.seasonView = null; save(); ui.peekId = null;
      ui.msg = `Restored ${d.games.length} game${d.games.length === 1 ? "" : "s"} and ${d.team.players.length} players.`;
      render();
    } catch (e) { ui.msg = "That file isn't a ScoreKept backup."; renderSheet(); }
    ev.target.value = "";
  };
  reader.readAsText(f);
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && ui.sheet && ui.sheet.type !== "onboard") closeSheet();
  if (ev.key === "Enter" && ev.target && ev.target.id === "onbPName") { ev.preventDefault(); onbAddPlayer(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches(".base")) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

// Pick a layout from the screen's size and shape, and again whenever it rotates or resizes.
const LAYOUT_NAMES = { phone: "Phone", short: "Phone on its side / small landscape screen", tablet: "Tablet, upright", wide: "Tablet on its side / computer" };
function detectLayout() {
  const w = window.innerWidth, h = window.innerHeight;
  const L = h <= 560 && w > h ? "short" : w < 600 ? "phone" : w >= 1000 && w > h * 1.1 ? "wide" : "tablet";
  if (document.documentElement.dataset.layout === L) return false;
  document.documentElement.dataset.layout = L;
  return true;
}
let layoutTimer = null;
window.addEventListener("resize", () => { clearTimeout(layoutTimer); layoutTimer = setTimeout(() => { if (detectLayout()) { shellKey = ""; render(); } }, 120); });
detectLayout();

// First launch: the welcome setup. The screen preview page always shows the sample season.
const saved = load(), previewMode = /[?&]preview\b/.test(location.search);
store = ensureSeasons(saved || (previewMode || safety.unreadable || safety.blocked ? sampleStore() : blankStore()));
if (!saved && !previewMode && !safety.unreadable && !safety.blocked) ui.sheet = { type: "onboard", step: "welcome" };
loadClips();
protectStorage();
document.addEventListener("click", () => { if (safety.protected === false) protectStorage(); }, { once: true });
window.addEventListener("online", renderAlert);
window.addEventListener("offline", renderAlert);
// Keep a copy of the app on the device so it opens with no signal (the site only; not the preview)
if ("serviceWorker" in navigator && ((location.protocol === "https:" && /github\.io$/.test(location.hostname)) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (store.currentId) ui.view = "game";
render();
})();
</script>
</body>
